name: Adaptive Event Detector

on:
  workflow_run:
    workflows:
      - "Paribu Market Data"
    types:
      - completed

permissions:
  contents: write

jobs:
  detect:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Paribu snapshot
        shell: bash
        run: |
          set -euo pipefail

          test -f data/latest.json
          test -f state/lifecycle.json

          jq -e '
            .ok == true
            and (.fetched_at | type == "string")
            and (.markets.virtual_tl.ticker[0].last != null)
            and (.markets.fet_tl.ticker[0].last != null)
            and (.markets.kite_tl.ticker[0].last != null)
          ' data/latest.json >/dev/null

          echo "Paribu snapshot: OK"
          echo "Fetched at:"
          jq -r '.fetched_at' data/latest.json

          echo "Lifecycle state store: OK"
          jq -r '
            to_entries[]
            | "\(.key): \(.value.state)"
          ' state/lifecycle.json

      - name: Event detector trigger test
        run: |
          echo "Adaptive Event Detector triggered."
          echo "Source workflow: Paribu Market Data"
          echo "Source run: ${{ github.event.workflow_run.id }}"
