name: Combined Decision Engine

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: combined-decision-engine
  cancel-in-progress: false

jobs:
  combine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run combined decision engine
        shell: python
        run: |
          import json
          from pathlib import Path
          from datetime import datetime, timezone

          # =========================================================
          # PATHS
          # =========================================================

          LOCAL_PATH = Path(
              "state/decision.json"
          )

          GLOBAL_PATH = Path(
              "state/global_evidence.json"
          )

          OUTPUT_PATH = Path(
              "state/combined_decision.json"
          )

          # =========================================================
          # LOAD LOCAL DECISION
          # =========================================================

          if not LOCAL_PATH.exists():

              print(
                  "Local decision state unavailable."
              )

              raise SystemExit(1)

          local = json.loads(
              LOCAL_PATH.read_text(
                  encoding="utf-8"
              )
          )

          # =========================================================
          # LOAD GLOBAL EVIDENCE
          #
          # This file is the input contract for the
          # Binance + OKX connector layer.
          #
          # The connector integration itself is intentionally
          # NOT automated yet.
          # =========================================================

          if GLOBAL_PATH.exists():

              try:

                  global_evidence = json.loads(
                      GLOBAL_PATH.read_text(
                          encoding="utf-8"
                      )
                  )

              except (
                  OSError,
                  json.JSONDecodeError
              ):

                  global_evidence = {}

          else:

              global_evidence = {}

          # =========================================================
          # TIME
          # =========================================================

          generated_at = datetime.now(
              timezone.utc
          ).isoformat()

          # =========================================================
          # HELPERS
          # =========================================================

          def safe_number(value):

              try:
                  return float(value)

              except (
                  TypeError,
                  ValueError
              ):

                  return None


          def normalize_direction(value):

              if not value:
                  return "UNKNOWN"

              value = str(
                  value
              ).upper()

              if value in {
                  "UP",
                  "BULLISH",
                  "POSITIVE"
              }:

                  return "UP"

              if value in {
                  "DOWN",
                  "BEARISH",
                  "NEGATIVE"
              }:

                  return "DOWN"

              if value in {
                  "FLAT",
                  "NEUTRAL"
              }:

                  return "FLAT"

              return "UNKNOWN"


          def get_global_coin(
              coin
          ):

              item = global_evidence.get(
                  coin,
                  {}
              )

              if not isinstance(
                  item,
                  dict
              ):

                  return {}

              return item


          def source_direction(
              source
          ):

              if not isinstance(
                  source,
                  dict
              ):

                  return "UNKNOWN"

              # Preferred explicit direction.
              direction = (
                  source.get(
                      "direction"
                  )
              )

              if direction:
                  return normalize_direction(
                      direction
                  )

              # Fallback to percentage change.
              change = safe_number(
                  source.get(
                      "change_24h_pct"
                  )
              )

              if change is None:
                  return "UNKNOWN"

              if change > 0:
                  return "UP"

              if change < 0:
                  return "DOWN"

              return "FLAT"


          def global_consensus(
              item
          ):

              binance = item.get(
                  "binance",
                  {}
              )

              okx = item.get(
                  "okx",
                  {}
              )

              binance_direction = (
                  source_direction(
                      binance
                  )
              )

              okx_direction = (
                  source_direction(
                      okx
                  )
              )

              if (
                  binance_direction
                  == "UNKNOWN"
                  or okx_direction
                  == "UNKNOWN"
              ):

                  return (
                      "INSUFFICIENT",
                      binance_direction,
                      okx_direction
                  )

              if (
                  binance_direction
                  == okx_direction
                  and binance_direction
                  in {
                      "UP",
                      "DOWN"
                  }
              ):

                  return (
                      "CONFIRMED",
                      binance_direction,
                      okx_direction
                  )

              if (
                  binance_direction
                  == "FLAT"
                  and okx_direction
                  == "FLAT"
              ):

                  return (
                      "NEUTRAL",
                      binance_direction,
                      okx_direction
                  )

              return (
                  "CONFLICT",
                  binance_direction,
                  okx_direction
              )


          # =========================================================
          # LOCAL CLASSIFICATION
          # =========================================================

          def classify_local(
              item
          ):

              if not item:
                  return "UNKNOWN"

              decision = str(
                  item.get(
                      "decision",
                      "NONE"
                  )
              )

              lifecycle = str(
                  item.get(
                      "last_lifecycle_state",
                      "UNKNOWN"
                  )
              ).upper()

              pressure = str(
                  item.get(
                      "orderbook_pressure",
                      "unknown"
                  )
              ).lower()

              # Strong local upward evidence.
              if (
                  decision
                  == "ADD_CONSIDER"
                  and lifecycle
                  in {
                      "REVERSAL_STRONG",
                      "REVERSAL_UP",
                      "UP"
                  }
              ):

                  return "STRONG_UP"

              # Strong local downward evidence.
              if (
                  decision
                  == "REDUCE_PROFIT"
                  and lifecycle
                  in {
                      "REVERSAL_STRONG",
                      "REVERSAL_DOWN",
                      "DOWN"
                  }
              ):

                  return "STRONG_DOWN"

              # Existing local WAIT states can still contain
              # directional evidence.
              if (
                  lifecycle
                  in {
                      "REVERSAL_UP",
                      "UP",
                      "REVERSAL_STRONG"
                  }
                  and pressure
                  == "demand_heavy"
              ):

                  return "UP"

              if (
                  lifecycle
                  in {
                      "REVERSAL_DOWN",
                      "DOWN",
                      "REVERSAL_STRONG"
                  }
                  and pressure
                  == "supply_heavy"
              ):

                  return "DOWN"

              return "NEUTRAL"


          # =========================================================
          # COMBINED DECISION
          # =========================================================

          def combined_decision(
              local_item,
              global_item
          ):

              local_class = classify_local(
                  local_item
              )

              (
                  consensus,
                  binance_direction,
                  okx_direction
              ) = global_consensus(
                  global_item
              )

              # -----------------------------------------------------
              # DATA SAFETY
              # -----------------------------------------------------

              if consensus == "INSUFFICIENT":

                  return (
                      "NO_ACTION",
                      "LOW",
                      local_class,
                      consensus,
                      (
                          "Binance ve OKX global "
                          "evidence yeterli değil."
                      )
                  )

              # -----------------------------------------------------
              # GLOBAL CONFLICT
              # -----------------------------------------------------

              if consensus == "CONFLICT":

                  return (
                      "WAIT",
                      "LOW",
                      local_class,
                      consensus,
                      (
                          "Binance ve OKX farklı "
                          "yön gösteriyor."
                      )
                  )

              # -----------------------------------------------------
              # STRONG LOCAL + STRONG GLOBAL
              # -----------------------------------------------------

              if (
                  local_class
                  == "STRONG_UP"
                  and consensus
                  == "CONFIRMED"
                  and binance_direction
                  == "UP"
                  and okx_direction
                  == "UP"
              ):

                  return (
                      "ADD_CONSIDER",
                      "HIGH",
                      local_class,
                      consensus,
                      (
                          "Lokal güçlü yukarı teyit "
                          "ve Binance + OKX global "
                          "yukarı teyidi birlikte."
                      )
                  )

              if (
                  local_class
                  == "STRONG_DOWN"
                  and consensus
                  == "CONFIRMED"
                  and binance_direction
                  == "DOWN"
                  and okx_direction
                  == "DOWN"
              ):

                  return (
                      "REDUCE_PROFIT",
                      "HIGH",
                      local_class,
                      consensus,
                      (
                          "Lokal güçlü aşağı teyit "
                          "ve Binance + OKX global "
                          "aşağı teyidi birlikte."
                      )
                  )

              # -----------------------------------------------------
              # GLOBAL STRONG / LOCAL NEUTRAL
              # -----------------------------------------------------

              if (
                  local_class
                  == "NEUTRAL"
                  and consensus
                  == "CONFIRMED"
              ):

                  return (
                      "WAIT",
                      "MEDIUM",
                      local_class,
                      consensus,
                      (
                          "Global yön güçlü ancak "
                          "lokal giriş/çıkış teyidi "
                          "yeterli değil."
                      )
                  )

              # -----------------------------------------------------
              # LOCAL UP / GLOBAL UP
              # -----------------------------------------------------

              if (
                  local_class
                  == "UP"
                  and consensus
                  == "CONFIRMED"
                  and binance_direction
                  == "UP"
              ):

                  return (
                      "WAIT",
                      "MEDIUM",
                      local_class,
                      consensus,
                      (
                          "Lokal ve global yön yukarı "
                          "ancak ADD_CONSIDER için "
                          "güçlü lokal teyit gerekiyor."
                      )
                  )

              # -----------------------------------------------------
              # LOCAL DOWN / GLOBAL DOWN
              # -----------------------------------------------------

              if (
                  local_class
                  == "DOWN"
                  and consensus
                  == "CONFIRMED"
                  and binance_direction
                  == "DOWN"
              ):

                  return (
                      "WAIT",
                      "MEDIUM",
                      local_class,
                      consensus,
                      (
                          "Lokal ve global yön aşağı "
                          "ancak REDUCE_PROFIT için "
                          "güçlü teyit gerekiyor."
                      )
                  )

              # -----------------------------------------------------
              # LOCAL / GLOBAL OPPOSITE
              # -----------------------------------------------------

              if (
                  local_class
                  == "UP"
                  and consensus
                  == "CONFIRMED"
                  and binance_direction
                  == "DOWN"
              ):

                  return (
                      "WAIT",
                      "LOW",
                      local_class,
                      consensus,
                      (
                          "Lokal ve global yön "
                          "çatışıyor."
                      )
                  )

              if (
                  local_class
                  == "DOWN"
                  and consensus
                  == "CONFIRMED"
                  and binance_direction
                  == "UP"
              ):

                  return (
                      "WAIT",
                      "LOW",
                      local_class,
                      consensus,
                      (
                          "Lokal ve global yön "
                          "çatışıyor."
                      )
                  )

              return (
                  "WAIT",
                  "LOW",
                  local_class,
                  consensus,
                  (
                      "Yeterli birleşik teyit "
                      "oluşmadı."
                  )
              )


          # =========================================================
          # COINS
          # =========================================================

          coins = [
              "VIRTUAL",
              "FET",
              "KITE"
          ]

          output = {
              "generated_at": generated_at,
              "mode": "SHADOW",
              "global_sources": [
                  "BINANCE",
                  "OKX"
              ],
              "decisions": {}
          }

          print(
              "========================================"
          )

          print(
              "COMBINED DECISION ENGINE"
          )

          print(
              "MODE: SHADOW"
          )

          print(
              "========================================"
          )

          for coin in coins:

              local_item = local.get(
                  coin,
                  {}
              )

              global_item = get_global_coin(
                  coin
              )

              (
                  decision,
                  confidence,
                  local_class,
                  consensus,
                  reason
              ) = combined_decision(
                  local_item,
                  global_item
              )

              output[
                  "decisions"
              ][coin] = {

                  "decision": decision,

                  "confidence": confidence,

                  "local_class": (
                      local_class
                  ),

                  "global_consensus": (
                      consensus
                  ),

                  "binance_direction": (
                      global_consensus(
                          global_item
                      )[1]
                  ),

                  "okx_direction": (
                      global_consensus(
                          global_item
                      )[2]
                  ),

                  "local_decision": (
                      local_item.get(
                          "decision"
                      )
                  ),

                  "local_event": (
                      local_item.get(
                          "last_event"
                      )
                  ),

                  "local_lifecycle": (
                      local_item.get(
                          "last_lifecycle_state"
                      )
                  ),

                  "local_pressure": (
                      local_item.get(
                          "orderbook_pressure"
                      )
                  ),

                  "reason": reason,
              }

              print(
                  f"{coin}: "
                  f"{decision} | "
                  f"confidence={confidence} | "
                  f"local={local_class} | "
                  f"global={consensus}"
              )

          # =========================================================
          # WRITE
          # =========================================================

          OUTPUT_PATH.parent.mkdir(
              parents=True,
              exist_ok=True
          )

          OUTPUT_PATH.write_text(
              json.dumps(
                  output,
                  indent=2,
                  ensure_ascii=False
              ) + "\n",
              encoding="utf-8"
          )

          print()
          print(
              "Combined decision state written:"
          )

          print(
              OUTPUT_PATH
          )

      - name: Commit shadow decision
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state/combined_decision.json

          if git diff --cached --quiet; then
            echo "No combined decision changes."
            exit 0
          fi

          git commit -m "Add combined decision shadow engine"
          git push origin HEAD:main
