name: Calibration Backtest

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run calibration backtest
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json
          import glob
          import math
          from datetime import datetime, timezone

          COINS = {
              "VIRTUAL": "virtual_tl",
              "FET": "fet_tl",
              "KITE": "kite_tl",
          }

          HORIZONS = {
              "15m": 15 * 60,
              "1h": 60 * 60,
              "4h": 4 * 60 * 60,
              "24h": 24 * 60 * 60,
          }

          MAX_GAPS = {
              "15m": 12 * 60,
              "1h": 20 * 60,
              "4h": 30 * 60,
              "24h": 45 * 60,
          }

          def parse_time(value):
              if not value:
                  return None

              value = value.strip()

              if value.endswith("Z"):
                  value = value[:-1] + "+00:00"

              dt = datetime.fromisoformat(value)

              if dt.tzinfo is None:
                  dt = dt.replace(tzinfo=timezone.utc)

              return dt.astimezone(timezone.utc)

          def load_history():
              snapshots = []

              for path in sorted(glob.glob("history/*.jsonl")):
                  try:
                      with open(path, "r", encoding="utf-8") as f:
                          raw = f.read()

                      try:
                          wrapper = json.loads(raw)

                          if (
                              isinstance(wrapper, dict)
                              and isinstance(wrapper.get("content"), str)
                          ):
                              lines = wrapper["content"].splitlines()
                          else:
                              lines = raw.splitlines()

                      except json.JSONDecodeError:
                          lines = raw.splitlines()

                      for line in lines:
                          line = line.strip()

                          if not line:
                              continue

                          try:
                              item = json.loads(line)
                          except json.JSONDecodeError:
                              continue

                          timestamp = parse_time(item.get("fetched_at"))

                          if timestamp is None:
                              continue

                          markets = item.get("markets", {})
                          prices = {}

                          for coin, market_key in COINS.items():
                              market = markets.get(market_key, {})

                              try:
                                  price = float(market.get("last"))
                              except (TypeError, ValueError):
                                  price = None

                              if price is not None and price > 0:
                                  prices[coin] = price

                          if prices:
                              snapshots.append({
                                  "timestamp": timestamp,
                                  "prices": prices,
                              })

                  except OSError:
                      continue

              snapshots.sort(key=lambda x: x["timestamp"])

              deduped = []

              for snapshot in snapshots:
                  if (
                      deduped
                      and snapshot["timestamp"] == deduped[-1]["timestamp"]
                  ):
                      deduped[-1] = snapshot
                  else:
                      deduped.append(snapshot)

              return deduped

          def find_previous(snapshots, index, seconds, max_gap):
              current_time = snapshots[index]["timestamp"].timestamp()
              target_time = current_time - seconds

              for j in range(index - 1, -1, -1):
                  previous_time = snapshots[j]["timestamp"].timestamp()

                  if previous_time <= target_time:
                      gap = target_time - previous_time

                      if gap <= max_gap:
                          return snapshots[j]

                      return None

              return None

          def classify(abs_return, thresholds):
              if abs_return is None:
                  return "INSUFFICIENT_DATA"

              p90 = thresholds.get("p90")
              p95 = thresholds.get("p95")
              p97_5 = thresholds.get("p97_5")
              p99 = thresholds.get("p99")

              if p99 is not None and abs_return >= p99:
                  return "EXTREME"

              if p97_5 is not None and abs_return >= p97_5:
                  return "STRONG"

              if p95 is not None and abs_return >= p95:
                  return "SIGNIFICANT"

              if p90 is not None and abs_return >= p90:
                  return "ELEVATED"

              return "NORMAL"

          print("========================================")
          print("CALIBRATION BACKTEST")
          print("========================================")

          with open("state/calibration.json", "r", encoding="utf-8") as f:
              calibration = json.load(f)

          snapshots = load_history()

          print(f"Historical snapshots: {len(snapshots)}")

          if len(snapshots) < 20:
              raise SystemExit("Not enough historical snapshots.")

          print(
              "History:",
              snapshots[0]["timestamp"].isoformat(),
              "->",
              snapshots[-1]["timestamp"].isoformat(),
          )

          print()

          # ------------------------------------------------------------
          # Backtest all historical movements against the calibration.
          # ------------------------------------------------------------

          results = {}

          for coin in COINS:
              results[coin] = {}

              print("----------------------------------------")
              print(coin)
              print("----------------------------------------")

              for horizon, seconds in HORIZONS.items():
                  thresholds = (
                      calibration
                      .get("coins", {})
                      .get(coin, {})
                      .get("horizons", {})
                      .get(horizon, {})
                      .get("absolute_return_pct", {})
                  )

                  counts = {
                      "NORMAL": 0,
                      "ELEVATED": 0,
                      "SIGNIFICANT": 0,
                      "STRONG": 0,
                      "EXTREME": 0,
                      "INSUFFICIENT_DATA": 0,
                  }

                  examples = []

                  for i, snapshot in enumerate(snapshots):
                      current_price = snapshot["prices"].get(coin)

                      if current_price is None:
                          continue

                      previous = find_previous(
                          snapshots,
                          i,
                          seconds,
                          MAX_GAPS[horizon],
                      )

                      if previous is None:
                          counts["INSUFFICIENT_DATA"] += 1
                          continue

                      previous_price = previous["prices"].get(coin)

                      if previous_price is None or previous_price <= 0:
                          counts["INSUFFICIENT_DATA"] += 1
                          continue

                      signed_pct = (
                          (current_price - previous_price)
                          / previous_price
                          * 100.0
                      )

                      abs_pct = abs(signed_pct)

                      classification = classify(
                          abs_pct,
                          thresholds,
                      )

                      counts[classification] += 1

                      # Save a few examples of significant or stronger moves.
                      if (
                          classification
                          in {"SIGNIFICANT", "STRONG", "EXTREME"}
                          and len(examples) < 8
                      ):
                          direction = (
                              "UP"
                              if signed_pct > 0
                              else "DOWN"
                              if signed_pct < 0
                              else "FLAT"
                          )

                          examples.append({
                              "timestamp": snapshot["timestamp"]
                                  .isoformat()
                                  .replace("+00:00", "Z"),
                              "direction": direction,
                              "return_pct": round(signed_pct, 4),
                              "classification": classification,
                          })

                  results[coin][horizon] = {
                      "thresholds": {
                          "p90": thresholds.get("p90"),
                          "p95": thresholds.get("p95"),
                          "p97_5": thresholds.get("p97_5"),
                          "p99": thresholds.get("p99"),
                      },
                      "counts": counts,
                      "examples": examples,
                  }

                  print(
                      f"{horizon}: "
                      f"NORMAL={counts['NORMAL']} "
                      f"ELEVATED={counts['ELEVATED']} "
                      f"SIGNIFICANT={counts['SIGNIFICANT']} "
                      f"STRONG={counts['STRONG']} "
                      f"EXTREME={counts['EXTREME']}"
                  )

              print()

          # ------------------------------------------------------------
          # Focus specifically on the fast-moving period:
          # 19 Aug 00:00 UTC -> 21 Aug 23:59 UTC
          # ------------------------------------------------------------

          focus_start = datetime(
              2026, 8, 19, 0, 0, tzinfo=timezone.utc
          )

          focus_end = datetime(
              2026, 8, 22, 0, 0, tzinfo=timezone.utc
          )

          print("========================================")
          print("FOCUS PERIOD: 19-21 AUGUST UTC")
          print("========================================")

          focus_results = {}

          for coin in COINS:
              focus_results[coin] = {}

              print()
              print(coin)

              for horizon, seconds in HORIZONS.items():
                  thresholds = (
                      calibration
                      .get("coins", {})
                      .get(coin, {})
                      .get("horizons", {})
                      .get(horizon, {})
                      .get("absolute_return_pct", {})
                  )

                  counts = {
                      "NORMAL": 0,
                      "ELEVATED": 0,
                      "SIGNIFICANT": 0,
                      "STRONG": 0,
                      "EXTREME": 0,
                  }

                  for i, snapshot in enumerate(snapshots):
                      timestamp = snapshot["timestamp"]

                      if not (focus_start <= timestamp < focus_end):
                          continue

                      current_price = snapshot["prices"].get(coin)

                      if current_price is None:
                          continue

                      previous = find_previous(
                          snapshots,
                          i,
                          seconds,
                          MAX_GAPS[horizon],
                      )

                      if previous is None:
                          continue

                      previous_price = previous["prices"].get(coin)

                      if previous_price is None or previous_price <= 0:
                          continue

                      signed_pct = (
                          (current_price - previous_price)
                          / previous_price
                          * 100.0
                      )

                      classification = classify(
                          abs(signed_pct),
                          thresholds,
                      )

                      if classification in counts:
                          counts[classification] += 1

                  focus_results[coin][horizon] = counts

                  print(
                      f"  {horizon}: "
                      f"N={counts['NORMAL']} "
                      f"E={counts['ELEVATED']} "
                      f"S={counts['SIGNIFICANT']} "
                      f"ST={counts['STRONG']} "
                      f"X={counts['EXTREME']}"
                  )

          # ------------------------------------------------------------
          # Write a report for later inspection.
          # ------------------------------------------------------------

          report = {
              "schema_version": 1,
              "generated_at": datetime.now(timezone.utc)
                  .isoformat()
                  .replace("+00:00", "Z"),
              "historical_snapshots": len(snapshots),
              "history_start": snapshots[0]["timestamp"]
                  .isoformat()
                  .replace("+00:00", "Z"),
              "history_end": snapshots[-1]["timestamp"]
                  .isoformat()
                  .replace("+00:00", "Z"),
              "classification": {
                  "normal": "below p90",
                  "elevated": "p90 to below p95",
                  "significant": "p95 to below p97.5",
                  "strong": "p97.5 to below p99",
                  "extreme": "p99 or higher",
              },
              "all_history": results,
              "focus_19_21_august": focus_results,
          }

          with open(
              "state/calibration_backtest.json",
              "w",
              encoding="utf-8",
          ) as f:
              json.dump(
                  report,
                  f,
                  indent=2,
                  ensure_ascii=False,
              )
              f.write("\n")

          print()
          print(
              "Backtest report written to "
              "state/calibration_backtest.json"
          )
          PY

      - name: Validate backtest report
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json

          with open(
              "state/calibration_backtest.json",
              "r",
              encoding="utf-8",
          ) as f:
              data = json.load(f)

          assert data["schema_version"] == 1
          assert data["historical_snapshots"] > 0

          for coin in ("VIRTUAL", "FET", "KITE"):
              assert coin in data["all_history"]
              assert coin in data["focus_19_21_august"]

          print("Calibration backtest validation: OK")
          PY
