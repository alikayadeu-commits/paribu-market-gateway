name: Event Detection Backtest

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  event-backtest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run event detection backtest
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json
          import glob
          import math
          from datetime import datetime, timezone

          COINS = {
              "VIRTUAL": "virtual_tl",
              "FET": "fet_tl",
              "KITE": "kite_tl",
          }

          HORIZONS = {
              "15m": 15 * 60,
              "1h": 60 * 60,
              "4h": 4 * 60 * 60,
          }

          MAX_GAPS = {
              "15m": 12 * 60,
              "1h": 20 * 60,
              "4h": 30 * 60,
          }

          # Minimum conditions for a candidate event.
          #
          # These are deliberately conservative for the backtest.
          # We are testing detection quality, not generating trades.
          MIN_SIGNIFICANT_HORIZONS = 1

          def parse_time(value):
              if not value:
                  return None

              value = value.strip()

              if value.endswith("Z"):
                  value = value[:-1] + "+00:00"

              dt = datetime.fromisoformat(value)

              if dt.tzinfo is None:
                  dt = dt.replace(tzinfo=timezone.utc)

              return dt.astimezone(timezone.utc)

          def load_jsonl_history():
              snapshots = []

              for path in sorted(glob.glob("history/*.jsonl")):
                  try:
                      with open(path, "r", encoding="utf-8") as f:
                          raw = f.read()

                      try:
                          wrapper = json.loads(raw)

                          if (
                              isinstance(wrapper, dict)
                              and isinstance(wrapper.get("content"), str)
                          ):
                              lines = wrapper["content"].splitlines()
                          else:
                              lines = raw.splitlines()

                      except json.JSONDecodeError:
                          lines = raw.splitlines()

                      for line in lines:
                          line = line.strip()

                          if not line:
                              continue

                          try:
                              item = json.loads(line)
                          except json.JSONDecodeError:
                              continue

                          timestamp = parse_time(item.get("fetched_at"))

                          if timestamp is None:
                              continue

                          markets = item.get("markets", {})
                          prices = {}
                          volumes = {}

                          for coin, market_key in COINS.items():
                              market = markets.get(market_key, {})

                              try:
                                  price = float(market.get("last"))
                              except (TypeError, ValueError):
                                  price = None

                              try:
                                  volume = float(
                                      market.get("volume_24h")
                                      or market.get("volume")
                                      or 0
                                  )
                              except (TypeError, ValueError):
                                  volume = 0.0

                              if price is not None and price > 0:
                                  prices[coin] = price
                                  volumes[coin] = volume

                          if prices:
                              snapshots.append({
                                  "timestamp": timestamp,
                                  "prices": prices,
                                  "volumes": volumes,
                              })

                  except OSError:
                      continue

              snapshots.sort(key=lambda x: x["timestamp"])

              deduped = []

              for snapshot in snapshots:
                  if (
                      deduped
                      and snapshot["timestamp"]
                      == deduped[-1]["timestamp"]
                  ):
                      deduped[-1] = snapshot
                  else:
                      deduped.append(snapshot)

              return deduped

          def find_previous(
              snapshots,
              index,
              seconds,
              max_gap
          ):
              current = snapshots[index]["timestamp"].timestamp()
              target = current - seconds

              for j in range(index - 1, -1, -1):
                  previous = snapshots[j]["timestamp"].timestamp()

                  if previous <= target:
                      gap = target - previous

                      if gap <= max_gap:
                          return snapshots[j]

                      return None

              return None

          def signed_return(current, previous):
              if previous is None or previous <= 0:
                  return None

              return ((current - previous) / previous) * 100.0

          def classify(abs_pct, thresholds):
              if abs_pct is None:
                  return "INSUFFICIENT_DATA"

              p90 = thresholds.get("p90")
              p95 = thresholds.get("p95")
              p97 = thresholds.get("p97_5")
              p99 = thresholds.get("p99")

              if p99 is not None and abs_pct >= p99:
                  return "EXTREME"

              if p97 is not None and abs_pct >= p97:
                  return "STRONG"

              if p95 is not None and abs_pct >= p95:
                  return "SIGNIFICANT"

              if p90 is not None and abs_pct >= p90:
                  return "ELEVATED"

              return "NORMAL"

          def direction(value):
              if value is None:
                  return "UNKNOWN"

              if value > 0:
                  return "UP"

              if value < 0:
                  return "DOWN"

              return "FLAT"

          print("========================================")
          print("EVENT DETECTION BACKTEST")
          print("========================================")

          with open(
              "state/calibration.json",
              "r",
              encoding="utf-8"
          ) as f:
              calibration = json.load(f)

          snapshots = load_jsonl_history()

          print(f"Historical snapshots: {len(snapshots)}")

          if len(snapshots) < 20:
              raise SystemExit(
                  "Not enough historical snapshots."
              )

          print(
              "History:",
              snapshots[0]["timestamp"].isoformat(),
              "->",
              snapshots[-1]["timestamp"].isoformat()
          )

          print()

          # ------------------------------------------------------------
          # Candidate event logic
          #
          # A candidate event requires:
          #
          # 1. At least one horizon reaches SIGNIFICANT or stronger.
          # 2. Direction is available.
          #
          # We additionally record multi-horizon confirmation so we can
          # inspect whether the event persists rather than being a single
          # snapshot spike.
          # ------------------------------------------------------------

          all_results = {}

          for coin in COINS:
              events = []

              for i, snapshot in enumerate(snapshots):
                  current_price = snapshot["prices"].get(coin)

                  if current_price is None:
                      continue

                  horizon_results = {}
                  significant_horizons = []
                  strong_horizons = []
                  extreme_horizons = []

                  for horizon, seconds in HORIZONS.items():
                      previous = find_previous(
                          snapshots,
                          i,
                          seconds,
                          MAX_GAPS[horizon]
                      )

                      if previous is None:
                          continue

                      previous_price = previous["prices"].get(coin)

                      if previous_price is None:
                          continue

                      signed_pct = signed_return(
                          current_price,
                          previous_price
                      )

                      if signed_pct is None:
                          continue

                      thresholds = (
                          calibration
                          .get("coins", {})
                          .get(coin, {})
                          .get("horizons", {})
                          .get(horizon, {})
                          .get("absolute_return_pct", {})
                      )

                      classification = classify(
                          abs(signed_pct),
                          thresholds
                      )

                      horizon_results[horizon] = {
                          "return_pct": round(signed_pct, 4),
                          "direction": direction(signed_pct),
                          "classification": classification,
                      }

                      if classification in {
                          "SIGNIFICANT",
                          "STRONG",
                          "EXTREME"
                      }:
                          significant_horizons.append(horizon)

                      if classification in {
                          "STRONG",
                          "EXTREME"
                      }:
                          strong_horizons.append(horizon)

                      if classification == "EXTREME":
                          extreme_horizons.append(horizon)

                  if len(significant_horizons) < MIN_SIGNIFICANT_HORIZONS:
                      continue

                  # Use the shortest available significant horizon as
                  # the primary event horizon.
                  priority = ["15m", "1h", "4h"]

                  primary_horizon = None

                  for h in priority:
                      if h in significant_horizons:
                          primary_horizon = h
                          break

                  primary = horizon_results[primary_horizon]

                  events.append({
                      "timestamp": (
                          snapshot["timestamp"]
                          .isoformat()
                          .replace("+00:00", "Z")
                      ),
                      "coin": coin,
                      "event": "MEANINGFUL_MOVE",
                      "direction": primary["direction"],
                      "primary_horizon": primary_horizon,
                      "primary_return_pct": primary["return_pct"],
                      "primary_classification": primary[
                          "classification"
                      ],
                      "significant_horizons": significant_horizons,
                      "strong_horizons": strong_horizons,
                      "extreme_horizons": extreme_horizons,
                      "horizon_detail": horizon_results,
                  })

              # ----------------------------------------------------------
              # Collapse consecutive candidate events into episodes.
              #
              # This is important: one sustained move should not create
              # dozens of independent events.
              # ----------------------------------------------------------

              episodes = []

              for event in events:
                  event_time = parse_time(event["timestamp"])

                  if not episodes:
                      episodes.append({
                          "start": event_time,
                          "end": event_time,
                          "direction": event["direction"],
                          "events": [event],
                      })
                      continue

                  previous_episode = episodes[-1]

                  gap = (
                      event_time - previous_episode["end"]
                  ).total_seconds()

                  same_direction = (
                      event["direction"]
                      == previous_episode["direction"]
                  )

                  # 60 minutes is an episode continuity window.
                  if gap <= 60 * 60 and same_direction:
                      previous_episode["end"] = event_time
                      previous_episode["events"].append(event)
                  else:
                      episodes.append({
                          "start": event_time,
                          "end": event_time,
                          "direction": event["direction"],
                          "events": [event],
                      })

              all_results[coin] = {
                  "candidate_event_count": len(events),
                  "episode_count": len(episodes),
                  "events": events,
                  "episodes": [
                      {
                          "start": (
                              episode["start"]
                              .isoformat()
                              .replace("+00:00", "Z")
                          ),
                          "end": (
                              episode["end"]
                              .isoformat()
                              .replace("+00:00", "Z")
                          ),
                          "direction": episode["direction"],
                          "candidate_events": len(
                              episode["events"]
                          ),
                          "strong_events": sum(
                              1
                              for e in episode["events"]
                              if e["strong_horizons"]
                          ),
                          "extreme_events": sum(
                              1
                              for e in episode["events"]
                              if e["extreme_horizons"]
                          ),
                      }
                      for episode in episodes
                  ],
              }

          # ------------------------------------------------------------
          # Focus on 19-21 August.
          # ------------------------------------------------------------

          focus_start = datetime(
              2026,
              8,
              19,
              0,
              0,
              tzinfo=timezone.utc
          )

          focus_end = datetime(
              2026,
              8,
              22,
              0,
              0,
              tzinfo=timezone.utc
          )

          print("========================================")
          print("FOCUS PERIOD: 19-21 AUGUST UTC")
          print("========================================")

          focus = {}

          for coin, data in all_results.items():
              focus_events = []

              for event in data["events"]:
                  timestamp = parse_time(event["timestamp"])

                  if focus_start <= timestamp < focus_end:
                      focus_events.append(event)

              focus_episodes = []

              for episode in data["episodes"]:
                  start = parse_time(episode["start"])
                  end = parse_time(episode["end"])

                  if end >= focus_start and start < focus_end:
                      focus_episodes.append(episode)

              focus[coin] = {
                  "candidate_events": len(focus_events),
                  "episodes": len(focus_episodes),
                  "events": focus_events[:20],
                  "episodes_detail": focus_episodes,
              }

              print()
              print(coin)
              print(
                  f"  Candidate events: {len(focus_events)}"
              )
              print(
                  f"  Episodes: {len(focus_episodes)}"
              )

              for episode in focus_episodes:
                  print(
                      "  ",
                      episode["start"],
                      "->",
                      episode["end"],
                      "|",
                      episode["direction"],
                      "|",
                      f"events={episode['candidate_events']}",
                      f"strong={episode['strong_events']}",
                      f"extreme={episode['extreme_events']}"
                  )

          # ------------------------------------------------------------
          # Direction consistency check.
          #
          # This does not make a trading decision.
          # It only tells us whether the short-term and medium-term
          # directions agree.
          # ------------------------------------------------------------

          print()
          print("========================================")
          print("MULTI-HORIZON CONSISTENCY")
          print("========================================")

          consistency = {}

          for coin in COINS:
              consistency[coin] = []

              for i, snapshot in enumerate(snapshots):
                  current_price = snapshot["prices"].get(coin)

                  if current_price is None:
                      continue

                  values = {}

                  for horizon, seconds in HORIZONS.items():
                      previous = find_previous(
                          snapshots,
                          i,
                          seconds,
                          MAX_GAPS[horizon]
                      )

                      if previous is None:
                          continue

                      previous_price = previous["prices"].get(coin)

                      if previous_price is None:
                          continue

                      pct = signed_return(
                          current_price,
                          previous_price
                      )

                      if pct is None:
                          continue

                      values[horizon] = pct

                  if len(values) < 2:
                      continue

                  dirs = [
                      direction(v)
                      for v in values.values()
                      if v is not None
                  ]

                  if not dirs:
                      continue

                  up = dirs.count("UP")
                  down = dirs.count("DOWN")

                  if up == len(dirs):
                      state = "ALIGNED_UP"
                  elif down == len(dirs):
                      state = "ALIGNED_DOWN"
                  else:
                      state = "MIXED"

                  consistency[coin].append({
                      "timestamp": (
                          snapshot["timestamp"]
                          .isoformat()
                          .replace("+00:00", "Z")
                      ),
                      "state": state,
                      "returns": {
                          h: round(v, 4)
                          for h, v in values.items()
                      }
                  })

              focus_consistency = [
                  item
                  for item in consistency[coin]
                  if focus_start
                  <= parse_time(item["timestamp"])
                  < focus_end
              ]

              aligned_up = sum(
                  1
                  for item in focus_consistency
                  if item["state"] == "ALIGNED_UP"
              )

              aligned_down = sum(
                  1
                  for item in focus_consistency
                  if item["state"] == "ALIGNED_DOWN"
              )

              mixed = sum(
                  1
                  for item in focus_consistency
                  if item["state"] == "MIXED"
              )

              print()
              print(coin)
              print(
                  "  19-21 Aug:",
                  f"ALIGNED_UP={aligned_up}",
                  f"ALIGNED_DOWN={aligned_down}",
                  f"MIXED={mixed}"
              )

          report = {
              "schema_version": 1,
              "generated_at": (
                  datetime.now(timezone.utc)
                  .isoformat()
                  .replace("+00:00", "Z")
              ),
              "timezone": "UTC",
              "history": {
                  "snapshots": len(snapshots),
                  "start": (
                      snapshots[0]["timestamp"]
                      .isoformat()
                      .replace("+00:00", "Z")
                  ),
                  "end": (
                      snapshots[-1]["timestamp"]
                      .isoformat()
                      .replace("+00:00", "Z")
                  ),
              },
              "method": {
                  "candidate_event": (
                      "At least one historical return horizon "
                      "reaches SIGNIFICANT or stronger."
                  ),
                  "episode_window_seconds": 3600,
                  "decision": (
                      "No trade decision is produced by this backtest."
                  ),
              },
              "all_history": all_results,
              "focus_19_21_august": focus,
              "multi_horizon_consistency": consistency,
          }

          with open(
              "state/event_backtest.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  report,
                  f,
                  indent=2,
                  ensure_ascii=False
              )
              f.write("\n")

          print()
          print(
              "Backtest report written to "
              "state/event_backtest.json"
          )
          PY

      - name: Validate event backtest
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json

          with open(
              "state/event_backtest.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          assert data["schema_version"] == 1
          assert data["timezone"] == "UTC"

          for coin in ("VIRTUAL", "FET", "KITE"):
              assert coin in data["all_history"]
              assert coin in data["focus_19_21_august"]

          print("Event backtest validation: OK")
          PY
