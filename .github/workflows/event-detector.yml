name: Adaptive Event Detector

on:
  workflow_run:
    workflows:
      - "Paribu Market Data"
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: adaptive-event-detector
  cancel-in-progress: false

jobs:
  detect:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect adaptive market events
        shell: python
        run: |
          import json
          import statistics
          from pathlib import Path
          from datetime import datetime, timezone

          COINS = {
              "VIRTUAL": "virtual_tl",
              "FET": "fet_tl",
              "KITE": "kite_tl",
          }

          latest_path = Path("data/latest.json")
          state_path = Path("state/lifecycle.json")
          events_path = Path("state/events.jsonl")

          latest = json.loads(latest_path.read_text())
          states = json.loads(state_path.read_text())

          if latest.get("ok") is not True:
              raise SystemExit("Invalid Paribu snapshot: ok != true")

          fetched_at = latest.get("fetched_at")

          if not fetched_at:
              raise SystemExit("Missing fetched_at")

          now = datetime.now(timezone.utc)

          fetched_dt = datetime.fromisoformat(
              fetched_at.replace("Z", "+00:00")
          )

          age_seconds = (now - fetched_dt).total_seconds()

          if age_seconds < -300:
              raise SystemExit("Future-dated Paribu snapshot")

          if age_seconds > 45 * 60:
              print("Paribu snapshot is stale. No event evaluation.")
              raise SystemExit(0)

          # ---------------------------------------------------------
          # LOAD HISTORY
          # ---------------------------------------------------------

          history_files = sorted(
              Path("history").glob("*.jsonl"),
              reverse=True
          )

          history = []

          for file in history_files:
              lines = file.read_text().splitlines()

              for line in reversed(lines):
                  if not line.strip():
                      continue

                  try:
                      row = json.loads(line)
                  except json.JSONDecodeError:
                      continue

                  history.append(row)

                  if len(history) >= 240:
                      break

              if len(history) >= 240:
                  break

          history.reverse()

          def get_prices(market):
              values = []

              for row in history:
                  try:
                      value = float(
                          row["markets"][market]["last"]
                      )
                      values.append(value)
                  except (KeyError, TypeError, ValueError):
                      continue

              return values

          def pct_change(a, b):
              if a is None or a <= 0:
                  return None
              return (b / a) - 1

          # ---------------------------------------------------------
          # EVENT CLASSIFICATION
          # ---------------------------------------------------------

          events = []

          for coin, market in COINS.items():

              current = latest["markets"][market]["ticker"][0]
              price = float(current["last"])

              prices = get_prices(market)

              # History already contains the current snapshot.
              # Therefore the previous snapshot is [-2], not [-1].
              if len(prices) < 3:
                  print(f"{coin}: insufficient history")
                  continue

              previous_price = prices[-2]

              current_change = pct_change(
                  previous_price,
                  price
              )

              if current_change is None:
                  continue

              # -----------------------------------------------------
              # Adaptive reference set
              # -----------------------------------------------------
              #
              # No fixed timeframe is imposed.
              # The detector uses the available history and adapts
              # the effective reference window to the amount of data.
              #

              available = len(prices) - 1

              if available < 6:
                  reference = prices[:-1]
              else:
                  dynamic_window = max(
                      6,
                      min(
                          available,
                          max(6, available // 3)
                      )
                  )

                  reference = prices[-(dynamic_window + 1):-1]

              if len(reference) < 3:
                  continue

              reference_returns = []

              for i in range(1, len(reference)):
                  change = pct_change(
                      reference[i - 1],
                      reference[i]
                  )

                  if change is not None:
                      reference_returns.append(change)

              if not reference_returns:
                  continue

              median_return = statistics.median(
                  reference_returns
              )

              median_abs_return = statistics.median(
                  abs(x) for x in reference_returns
              )

              # -----------------------------------------------------
              # Adaptive structure
              # -----------------------------------------------------

              reference_high = max(reference)
              reference_low = min(reference)

              event = None
              reason = None

              # 1. Structural expansion
              if price > reference_high and current_change > 0:
                  event = "structural_expansion_up"
                  reason = (
                      "Fiyat mevcut adaptif referans yapısının "
                      "üzerine çıkarak yukarı genişledi."
                  )

              elif price < reference_low and current_change < 0:
                  event = "structural_expansion_down"
                  reason = (
                      "Fiyat mevcut adaptif referans yapısının "
                      "altına çıkarak aşağı genişledi."
                  )

              # 2. Momentum acceleration
              if event is None and median_abs_return > 0:

                  acceleration_ratio = (
                      abs(current_change)
                      / median_abs_return
                  )

                  if acceleration_ratio >= 2.5:

                      if current_change > 0:
                          event = "momentum_acceleration_up"
                          reason = (
                              "Güncel hareket, yakın dönem "
                              "normal hareketliliğinin belirgin "
                              "şekilde üzerine çıktı."
                          )

                      elif current_change < 0:
                          event = "momentum_acceleration_down"
                          reason = (
                              "Güncel düşüş, yakın dönem "
                              "normal hareketliliğinin belirgin "
                              "şekilde üzerine çıktı."
                          )

              # 3. Directional reversal
              if event is None and len(reference_returns) >= 3:

                  positive_pressure = sum(
                      1 for x in reference_returns
                      if x > 0
                  )

                  negative_pressure = sum(
                      1 for x in reference_returns
                      if x < 0
                  )

                  if (
                      positive_pressure > negative_pressure
                      and current_change < 0
                  ):
                      event = "momentum_reversal_down"
                      reason = (
                          "Önceki yönlü baskı zayıflarken "
                          "güncel fiyat hareketi aşağı döndü."
                      )

                  elif (
                      negative_pressure > positive_pressure
                      and current_change > 0
                  ):
                      event = "momentum_reversal_up"
                      reason = (
                          "Önceki yönlü baskı zayıflarken "
                          "güncel fiyat hareketi yukarı döndü."
                      )

              # 4. No meaningful event
              if event is None:
                  continue

              previous_state = (
                  states.get(coin, {})
                  .get("state", "UNKNOWN")
              )

              # -----------------------------------------------------
              # Lifecycle state
              # -----------------------------------------------------

              if event == "structural_expansion_up":
                  current_state = "EXPANSION_UP"

              elif event == "structural_expansion_down":
                  current_state = "EXPANSION_DOWN"

              elif event == "momentum_acceleration_up":
                  current_state = "ACCELERATION_UP"

              elif event == "momentum_acceleration_down":
                  current_state = "ACCELERATION_DOWN"

              elif event == "momentum_reversal_up":
                  current_state = "REVERSAL_UP"

              elif event == "momentum_reversal_down":
                  current_state = "REVERSAL_DOWN"

              else:
                  current_state = previous_state

              # -----------------------------------------------------
              # IMPORTANT:
              # Same-state event = SILENT.
              # Lifecycle transition is what matters.
              # -----------------------------------------------------

              state_changed = (
                  current_state != previous_state
              )

              if not state_changed:
                  print(
                      f"{coin}: same state "
                      f"{current_state}; silent"
                  )
                  continue

              detected_at = datetime.now(
                  timezone.utc
              ).isoformat()

              event_record = {
                  "detected_at": detected_at,
                  "fetched_at": fetched_at,
                  "coin": coin,
                  "event": event,
                  "previous_state": previous_state,
                  "current_state": current_state,
                  "price": price,
                  "change_from_previous_snapshot": current_change,
                  "reference_high": reference_high,
                  "reference_low": reference_low,
                  "reason": reason,
              }

              events.append(event_record)

              # Update lifecycle state.
              if coin not in states:
                  states[coin] = {}

              states[coin]["state"] = current_state
              states[coin]["last_event"] = event
              states[coin]["last_transition_at"] = fetched_at
              states[coin]["last_decision"] = None

          # ---------------------------------------------------------
          # WRITE STATE
          # ---------------------------------------------------------

          state_path.write_text(
              json.dumps(
                  states,
                  indent=2,
                  ensure_ascii=False
              ) + "\n"
          )

          # ---------------------------------------------------------
          # WRITE EVENTS
          # ---------------------------------------------------------

          if events:
              with events_path.open("a") as f:
                  for event in events:
                      f.write(
                          json.dumps(
                              event,
                              ensure_ascii=False
                          ) + "\n"
                      )

          print("================================")
          print("Adaptive Event Detector")
          print("================================")
          print(f"Snapshot: {fetched_at}")
          print(f"Snapshot age: {age_seconds:.0f}s")
          print(f"Events detected: {len(events)}")

          for event in events:
              print(
                  f"{event['coin']}: "
                  f"{event['previous_state']} -> "
                  f"{event['current_state']} | "
                  f"{event['event']}"
              )

      - name: Commit lifecycle state
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state/lifecycle.json state/events.jsonl

          if git diff --cached --quiet; then
            echo "No lifecycle/event changes."
            exit 0
          fi

          git commit -m "Update adaptive lifecycle events"
          git push origin HEAD:main
