name: Adaptive Event Detector

on:
  workflow_run:
    workflows:
      - "Paribu Market Data"
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: adaptive-event-detector
  cancel-in-progress: false

jobs:
  detect:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect adaptive market events
        shell: python
        run: |
          import json
          from pathlib import Path
          from datetime import datetime, timezone

          COINS = {
              "VIRTUAL": "virtual_tl",
              "FET": "fet_tl",
              "KITE": "kite_tl",
          }

          latest_path = Path("data/latest.json")
          history_dir = Path("history")
          events_path = Path("state/events.jsonl")
          lifecycle_path = Path("state/lifecycle.json")

          latest = json.loads(latest_path.read_text())

          if latest.get("ok") is not True:
              print("Invalid Paribu snapshot. Nothing to detect.")
              raise SystemExit(0)

          fetched_at = latest.get("fetched_at")

          if not fetched_at:
              print("Missing fetched_at. Nothing to detect.")
              raise SystemExit(0)

          fetched_dt = datetime.fromisoformat(
              fetched_at.replace("Z", "+00:00")
          )

          now = datetime.now(timezone.utc)
          age_seconds = (now - fetched_dt).total_seconds()

          if age_seconds < -300:
              print("Future-dated snapshot. Nothing to detect.")
              raise SystemExit(0)

          if age_seconds > 45 * 60:
              print(
                  f"Stale Paribu snapshot: {age_seconds:.0f}s. "
                  "Nothing to detect."
              )
              raise SystemExit(0)

          # ---------------------------------------------------------
          # LOAD HISTORICAL SNAPSHOTS
          # ---------------------------------------------------------

          snapshots = []

          for path in sorted(history_dir.glob("*.jsonl")):
              for line in path.read_text().splitlines():
                  if not line.strip():
                      continue

                  try:
                      snapshots.append(json.loads(line))
                  except json.JSONDecodeError:
                      continue

          snapshots.sort(
              key=lambda x: x.get("fetched_at", "")
          )

          # ---------------------------------------------------------
          # LOAD EXISTING EVENTS FOR IDEMPOTENCY
          #
          # The same snapshot must never generate the same event
          # twice, even if the workflow is manually re-run.
          # ---------------------------------------------------------

          existing_event_keys = set()

          if events_path.exists():
              for line in events_path.read_text(
                  encoding="utf-8"
              ).splitlines():

                  if not line.strip():
                      continue

                  try:
                      event = json.loads(line)

                      key = (
                          event.get("fetched_at"),
                          event.get("coin"),
                          event.get("event"),
                      )

                      existing_event_keys.add(key)

                  except json.JSONDecodeError:
                      continue

          # ---------------------------------------------------------
          # HELPERS
          # ---------------------------------------------------------

          def number(value):
              try:
                  return float(value)
              except (TypeError, ValueError):
                  return None

          def current_market(market):
              return latest.get("markets", {}).get(market)

          def current_price(market):
              data = current_market(market)

              try:
                  return number(data["ticker"][0]["last"])
              except (KeyError, TypeError, IndexError):
                  return None

          def current_volume(market):
              data = current_market(market)

              try:
                  return number(data["ticker"][0]["volume"])
              except (KeyError, TypeError, IndexError):
                  return None

          def current_orderbook_pressure(market):
              data = current_market(market)

              try:
                  bids = data["orderbook"]["bids"]
                  asks = data["orderbook"]["asks"]

                  bid_value = 0.0
                  ask_value = 0.0

                  for item in bids:
                      price = number(item[0])
                      quantity = number(item[1])

                      if price is not None and quantity is not None:
                          bid_value += price * quantity

                  for item in asks:
                      price = number(item[0])
                      quantity = number(item[1])

                      if price is not None and quantity is not None:
                          ask_value += price * quantity

                  total = bid_value + ask_value

                  if total <= 0:
                      return "unknown"

                  ratio = bid_value / total

                  if ratio >= 0.60:
                      return "demand_heavy"

                  if ratio <= 0.40:
                      return "supply_heavy"

                  return "balanced"

              except (KeyError, TypeError, IndexError):
                  return "unknown"

          def historical_coin_snapshots(market):
              result = []

              for snapshot in snapshots:
                  try:
                      result.append(
                          snapshot["markets"][market]
                      )
                  except KeyError:
                      continue

              return result

          # ---------------------------------------------------------
          # EVENT DETECTOR
          #
          # IMPORTANT:
          #
          # EVENT != STATE
          # EVENT != DECISION
          # EVENT != PUSH
          #
          # This layer only identifies meaningful market behaviour.
          # ---------------------------------------------------------

          def detect_event(coin, market):

              price = current_price(market)
              volume = current_volume(market)
              pressure = current_orderbook_pressure(market)

              if price is None:
                  return None

              hist = historical_coin_snapshots(market)

              if not hist:
                  return {
                      "event": "INITIAL_OBSERVATION",
                      "decision_relevant": False,
                      "global_validation_required": False,
                      "price": price,
                      "change_from_previous_snapshot": None,
                      "volume_change": None,
                      "orderbook_pressure": pressure,
                      "reason": "İlk kullanılabilir gözlem.",
                  }

              last = hist[-1]

              previous_price = number(last.get("last"))
              previous_volume = number(last.get("volume"))

              if previous_price in (None, 0):
                  return None

              price_change = (
                  (price - previous_price)
                  / previous_price
                  * 100
              )

              volume_change = None

              if (
                  previous_volume not in (None, 0)
                  and volume is not None
              ):
                  volume_change = (
                      (volume - previous_volume)
                      / abs(previous_volume)
                      * 100
                  )

              # -----------------------------------------------------
              # RECENT STRUCTURE
              # -----------------------------------------------------

              recent = hist[-8:]

              recent_prices = [
                  number(x.get("last"))
                  for x in recent
                  if number(x.get("last")) is not None
              ]

              recent_highs = [
                  number(x.get("high"))
                  for x in recent
                  if number(x.get("high")) is not None
              ]

              recent_lows = [
                  number(x.get("low"))
                  for x in recent
                  if number(x.get("low")) is not None
              ]

              if not recent_prices:
                  return None

              recent_high = (
                  max(recent_highs)
                  if recent_highs
                  else None
              )

              recent_low = (
                  min(recent_lows)
                  if recent_lows
                  else None
              )

              earlier_price = (
                  recent_prices[0]
                  if len(recent_prices) >= 2
                  else previous_price
              )

              recent_move = (
                  (price - earlier_price)
                  / earlier_price
                  * 100
              )

              # -----------------------------------------------------
              # EVENT CLASSIFICATION
              # -----------------------------------------------------

              event = None
              reason = None
              decision_relevant = False
              global_required = False

              # Structural expansion.
              #
              # This is the ONLY event that can directly describe
              # structural expansion.
              #
              # Reversal or orderbook pressure cannot promote the
              # lifecycle into EXPANSION.
              # -----------------------------------------------------

              if (
                  recent_high is not None
                  and price > recent_high
                  and recent_move > 0
              ):
                  event = "EXPANSION_UP"

                  reason = (
                      "Fiyat yakın tarihsel yapının üzerine "
                      "çıkarak yukarı yönlü yapısal genişleme "
                      "gösteriyor."
                  )

                  decision_relevant = True
                  global_required = True

              elif (
                  recent_low is not None
                  and price < recent_low
                  and recent_move < 0
              ):
                  event = "EXPANSION_DOWN"

                  reason = (
                      "Fiyat yakın tarihsel yapının altına "
                      "çıkarak aşağı yönlü yapısal genişleme "
                      "gösteriyor."
                  )

                  decision_relevant = True
                  global_required = True

              # -----------------------------------------------------
              # REVERSAL
              #
              # Reversal is a decision event.
              # It is NOT automatically an expansion state.
              # -----------------------------------------------------

              elif (
                  price_change > 0
                  and recent_move < 0
              ):
                  event = "REVERSAL_UP"

                  reason = (
                      "Önceki zayıflık sonrasında fiyat "
                      "yönü yukarı dönüyor."
                  )

                  decision_relevant = True
                  global_required = True

              elif (
                  price_change < 0
                  and recent_move > 0
              ):
                  event = "REVERSAL_DOWN"

                  reason = (
                      "Önceki güçlenme sonrasında fiyat "
                      "yönü aşağı dönüyor."
                  )

                  decision_relevant = True
                  global_required = True

              # -----------------------------------------------------
              # PARTICIPATION
              #
              # Participation is evidence, not a lifecycle state.
              # -----------------------------------------------------

              elif (
                  volume_change is not None
                  and abs(volume_change) >= 25
                  and abs(price_change) >= 0.5
              ):

                  if price_change > 0:
                      event = "PARTICIPATION_EXPANSION_UP"

                      reason = (
                          "Fiyat hareketine belirgin "
                          "katılım artışı eşlik ediyor."
                      )

                  else:
                      event = "PARTICIPATION_EXPANSION_DOWN"

                      reason = (
                          "Aşağı yönlü fiyat hareketine "
                          "belirgin katılım artışı eşlik ediyor."
                      )

                  decision_relevant = True
                  global_required = True

              # -----------------------------------------------------
              # ORDERBOOK PRESSURE
              #
              # Pressure alone does NOT change lifecycle.
              # It is evidence for the Decision Engine.
              # -----------------------------------------------------

              elif (
                  pressure == "demand_heavy"
                  and price_change > 0
              ):

                  event = "DEMAND_SUPPORT"

                  reason = (
                      "Pozitif fiyat hareketi sırasında "
                      "görünür alış likiditesi baskın."
                  )

                  decision_relevant = True
                  global_required = True

              elif (
                  pressure == "supply_heavy"
                  and price_change < 0
              ):

                  event = "SUPPLY_PRESSURE"

                  reason = (
                      "Negatif fiyat hareketi sırasında "
                      "görünür satış likiditesi baskın."
                  )

                  decision_relevant = True
                  global_required = True

              else:
                  return None

              return {
                  "coin": coin,
                  "event": event,
                  "decision_relevant": decision_relevant,
                  "global_validation_required": global_required,
                  "price": price,
                  "change_from_previous_snapshot": price_change,
                  "volume_change": volume_change,
                  "orderbook_pressure": pressure,
                  "reason": reason,
              }

          # ---------------------------------------------------------
          # LIFECYCLE
          #
          # Only structural/reversal events can change lifecycle.
          # Evidence events such as SUPPLY_PRESSURE and
          # DEMAND_SUPPORT do NOT automatically change state.
          # ---------------------------------------------------------

          if lifecycle_path.exists():
              lifecycle = json.loads(
                  lifecycle_path.read_text(
                      encoding="utf-8"
                  )
              )
          else:
              lifecycle = {}

          events_to_write = []

          for coin, market in COINS.items():

              detected = detect_event(coin, market)

              if not detected:
                  print(f"{coin}: no meaningful event")
                  continue

              event_name = detected["event"]

              event_key = (
                  fetched_at,
                  coin,
                  event_name,
              )

              # -----------------------------------------------------
              # IDEMPOTENCY
              # -----------------------------------------------------

              if event_key in existing_event_keys:
                  print(
                      f"{coin}: duplicate snapshot/event "
                      f"ignored ({event_name})"
                  )
                  continue

              detected_at = datetime.now(
                  timezone.utc
              ).isoformat()

              previous_state = lifecycle.get(
                  coin,
                  {}
              ).get(
                  "state",
                  "UNKNOWN"
              )

              # -----------------------------------------------------
              # STATE TRANSITION
              # -----------------------------------------------------

              current_state = previous_state

              if event_name == "EXPANSION_UP":
                  current_state = "EXPANSION_UP"

              elif event_name == "EXPANSION_DOWN":
                  current_state = "EXPANSION_DOWN"

              elif event_name == "REVERSAL_UP":
                  current_state = "REVERSAL_UP"

              elif event_name == "REVERSAL_DOWN":
                  current_state = "REVERSAL_DOWN"

              elif event_name == "PARTICIPATION_EXPANSION_UP":
                  current_state = previous_state

              elif event_name == "PARTICIPATION_EXPANSION_DOWN":
                  current_state = previous_state

              elif event_name == "DEMAND_SUPPORT":
                  current_state = previous_state

              elif event_name == "SUPPLY_PRESSURE":
                  current_state = previous_state

              # -----------------------------------------------------
              # UPDATE LIFECYCLE
              # -----------------------------------------------------

              lifecycle[coin] = {
                  "state": current_state,
                  "last_event": event_name,
                  "updated_at": detected_at,
              }

              events_to_write.append({
                  "detected_at": detected_at,
                  "fetched_at": fetched_at,
                  "coin": coin,
                  "event": event_name,
                  "previous_state": previous_state,
                  "current_state": current_state,
                  "decision_relevant": detected[
                      "decision_relevant"
                  ],
                  "global_validation_required": detected[
                      "global_validation_required"
                  ],
                  "price": detected["price"],
                  "change_from_previous_snapshot": detected[
                      "change_from_previous_snapshot"
                  ],
                  "volume_change": detected[
                      "volume_change"
                  ],
                  "orderbook_pressure": detected[
                      "orderbook_pressure"
                  ],
                  "reason": detected["reason"],
              })

              print(
                  f"{coin}: {event_name} | "
                  f"{previous_state} -> {current_state}"
              )

          # ---------------------------------------------------------
          # WRITE EVENTS
          # ---------------------------------------------------------

          if events_to_write:

              events_path.parent.mkdir(
                  parents=True,
                  exist_ok=True
              )

              with events_path.open(
                  "a",
                  encoding="utf-8"
              ) as f:

                  for event in events_to_write:
                      f.write(
                          json.dumps(
                              event,
                              ensure_ascii=False
                          )
                          + "\n"
                      )

          # ---------------------------------------------------------
          # WRITE LIFECYCLE
          # ---------------------------------------------------------

          lifecycle_path.parent.mkdir(
              parents=True,
              exist_ok=True
          )

          lifecycle_path.write_text(
              json.dumps(
                  lifecycle,
                  indent=2,
                  ensure_ascii=False
              )
              + "\n",
              encoding="utf-8"
          )

          print("--------------------------------")
          print("Adaptive Event Detector complete")
          print(f"Snapshot: {fetched_at}")
          print(f"Age: {age_seconds:.0f}s")
          print("--------------------------------")

      - name: Commit detector state
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state/events.jsonl state/lifecycle.json

          if git diff --cached --quiet; then
            echo "No detector state changes."
            exit 0
          fi

          git commit -m "Separate event and lifecycle state"
          git push origin HEAD:main
