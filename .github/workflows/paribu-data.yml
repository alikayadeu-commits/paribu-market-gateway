name: Paribu Market Data

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paribu-market-data
  cancel-in-progress: false

jobs:
  fetch-paribu:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Paribu data
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p data history orderbook_history

          fetched_at="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          history_date="$(date -u +"%Y-%m-%d")"

          for market in virtual_tl fet_tl kite_tl; do
            ticker="$(curl -fsS --retry 3 \
              "https://api.paribu.com/market/ticker?market=${market}")"

            orderbook="$(curl -fsS --retry 3 \
              "https://api.paribu.com/orderbook?market=${market}&depth=20")"

            jq -n \
              --arg market "$market" \
              --arg fetched_at "$fetched_at" \
              --argjson ticker "$ticker" \
              --argjson orderbook "$orderbook" \
              '{
                market: $market,
                fetched_at: $fetched_at,
                ticker: $ticker,
                orderbook: $orderbook
              }' \
              > "data/${market}.json"
          done

          jq -n \
            --arg fetched_at "$fetched_at" \
            --slurpfile virtual data/virtual_tl.json \
            --slurpfile fet data/fet_tl.json \
            --slurpfile kite data/kite_tl.json \
            '{
              ok: true,
              fetched_at: $fetched_at,
              markets: {
                virtual_tl: $virtual[0],
                fet_tl: $fet[0],
                kite_tl: $kite[0]
              }
            }' > data/latest.json

          # Keep the existing price/volume history unchanged.
          jq -c \
            --arg fetched_at "$fetched_at" \
            '{
              fetched_at: $fetched_at,
              markets: {
                virtual_tl: {
                  last: .markets.virtual_tl.ticker[0].last,
                  high: .markets.virtual_tl.ticker[0].high,
                  low: .markets.virtual_tl.ticker[0].low,
                  volume: .markets.virtual_tl.ticker[0].volume
                },
                fet_tl: {
                  last: .markets.fet_tl.ticker[0].last,
                  high: .markets.fet_tl.ticker[0].high,
                  low: .markets.fet_tl.ticker[0].low,
                  volume: .markets.fet_tl.ticker[0].volume
                },
                kite_tl: {
                  last: .markets.kite_tl.ticker[0].last,
                  high: .markets.kite_tl.ticker[0].high,
                  low: .markets.kite_tl.ticker[0].low,
                  volume: .markets.kite_tl.ticker[0].volume
                }
              }
            }' data/latest.json \
            >> "history/${history_date}.jsonl"

          # Store a separate historical orderbook snapshot.
          # This does not modify or replace the existing market history.
          jq -c \
            --arg fetched_at "$fetched_at" \
            '{
              fetched_at: $fetched_at,
              markets: {
                virtual_tl: {
                  seq: .markets.virtual_tl.orderbook.seq,
                  timestamp: .markets.virtual_tl.orderbook.timestamp,
                  last_offset: .markets.virtual_tl.orderbook.last_offset,
                  last: .markets.virtual_tl.ticker[0].last,
                  bids: .markets.virtual_tl.orderbook.bids,
                  asks: .markets.virtual_tl.orderbook.asks
                },
                fet_tl: {
                  seq: .markets.fet_tl.orderbook.seq,
                  timestamp: .markets.fet_tl.orderbook.timestamp,
                  last_offset: .markets.fet_tl.orderbook.last_offset,
                  last: .markets.fet_tl.ticker[0].last,
                  bids: .markets.fet_tl.orderbook.bids,
                  asks: .markets.fet_tl.orderbook.asks
                },
                kite_tl: {
                  seq: .markets.kite_tl.orderbook.seq,
                  timestamp: .markets.kite_tl.orderbook.timestamp,
                  last_offset: .markets.kite_tl.orderbook.last_offset,
                  last: .markets.kite_tl.ticker[0].last,
                  bids: .markets.kite_tl.orderbook.bids,
                  asks: .markets.kite_tl.orderbook.asks
                }
              }
            }' data/latest.json \
            >> "orderbook_history/${history_date}.jsonl"

      - name: Commit data
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/ history/ orderbook_history/

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Add Paribu orderbook history"

          git fetch origin main
          git rebase origin/main

          git push origin HEAD:main
