name: Global Evidence Layer

on:
  workflow_run:
    workflows:
      - "Adaptive Event Detector"
    types:
      - completed

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: global-evidence
  cancel-in-progress: false

jobs:
  collect:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # COLLECT MARKET EVIDENCE
      # ============================================================

      - name: Collect market evidence
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p state/evidence

          captured_at="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          current_epoch="$(date -u +%s)"

          echo "========================================"
          echo "GLOBAL EVIDENCE LAYER"
          echo "========================================"
          echo "Captured at: ${captured_at}"

          # ========================================================
          # FRESHNESS FUNCTIONS
          # ========================================================

          classify_paribu_age() {
            local age="$1"

            if [ "$age" -le 1200 ]; then
              echo "fresh"
            elif [ "$age" -le 1800 ]; then
              echo "stale_warning"
            elif [ "$age" -le 2700 ]; then
              echo "degraded"
            else
              echo "stale"
            fi
          }

          classify_global_age() {
            local age="$1"

            if [ "$age" -le 300 ]; then
              echo "fresh"
            elif [ "$age" -le 900 ]; then
              echo "stale_warning"
            elif [ "$age" -le 1800 ]; then
              echo "degraded"
            else
              echo "stale"
            fi
          }

          # ========================================================
          # PARIBU
          # ========================================================

          if [ ! -f data/latest.json ]; then
            echo "ERROR: data/latest.json not found."
            exit 1
          fi

          cp data/latest.json state/evidence/paribu_raw.json

          paribu_fetched_at="$(
            jq -r '.fetched_at // empty' \
            data/latest.json
          )"

          if [ -z "$paribu_fetched_at" ]; then
            echo "ERROR: Paribu fetched_at missing."
            exit 1
          fi

          paribu_epoch="$(
            date -u -d "$paribu_fetched_at" +%s
          )"

          paribu_age=$((current_epoch - paribu_epoch))

          if [ "$paribu_age" -lt 0 ]; then
            paribu_age=0
          fi

          paribu_freshness="$(
            classify_paribu_age "$paribu_age"
          )"

          echo ""
          echo "PARIBU"
          echo "Fetched: ${paribu_fetched_at}"
          echo "Age: ${paribu_age}s"
          echo "Freshness: ${paribu_freshness}"

          jq \
            --arg freshness "$paribu_freshness" \
            --argjson age "$paribu_age" \
            '
            {
              available: (.ok == true),
              fetched_at: .fetched_at,
              age_seconds: $age,
              freshness: $freshness,

              markets: {
                VIRTUAL: {
                  price: (
                    .markets.virtual_tl.ticker[0].last
                    // null
                  ),
                  volume_24h: (
                    .markets.virtual_tl.ticker[0].volume
                    // null
                  )
                },

                FET: {
                  price: (
                    .markets.fet_tl.ticker[0].last
                    // null
                  ),
                  volume_24h: (
                    .markets.fet_tl.ticker[0].volume
                    // null
                  )
                },

                KITE: {
                  price: (
                    .markets.kite_tl.ticker[0].last
                    // null
                  ),
                  volume_24h: (
                    .markets.kite_tl.ticker[0].volume
                    // null
                  )
                }
              }
            }
            ' data/latest.json \
            > state/evidence/paribu.json

          # ========================================================
          # BINANCE FETCH
          # ========================================================

          fetch_binance() {
            local symbol="$1"
            local output="$2"

            if curl -fsS \
              --retry 3 \
              --retry-delay 1 \
              --connect-timeout 10 \
              --max-time 20 \
              "https://api.binance.com/api/v3/ticker/24hr?symbol=${symbol}" \
              > "$output"
            then

              jq empty "$output"

              jq '
                {
                  available: true,
                  symbol: (.symbol // null),
                  price: (
                    if .lastPrice != null
                    then (.lastPrice | tonumber)
                    else null
                    end
                  ),
                  change_24h_pct: (
                    if .priceChangePercent != null
                    then (.priceChangePercent | tonumber)
                    else null
                    end
                  ),
                  volume_24h: (
                    if .volume != null
                    then (.volume | tonumber)
                    else null
                    end
                  ),
                  quote_volume_24h: (
                    if .quoteVolume != null
                    then (.quoteVolume | tonumber)
                    else null
                    end
                  ),
                  timestamp_ms: (
                    if .closeTime != null
                    then (.closeTime | tonumber)
                    else null
                    end
                  )
                }
              ' "$output" \
              > "${output}.normalized"

              mv "${output}.normalized" "$output"

              return 0

            else

              jq -n \
                --arg symbol "$symbol" \
                '{
                  available: false,
                  symbol: $symbol,
                  price: null,
                  change_24h_pct: null,
                  volume_24h: null,
                  quote_volume_24h: null,
                  timestamp_ms: null,
                  error: "http_request_failed"
                }' \
                > "$output"

              return 1

            fi
          }

          echo ""
          echo "BINANCE"

          fetch_binance \
            "VIRTUALUSDT" \
            "state/evidence/binance_virtual.json" \
            || true

          fetch_binance \
            "FETUSDT" \
            "state/evidence/binance_fet.json" \
            || true

          fetch_binance \
            "KITEUSDT" \
            "state/evidence/binance_kite.json" \
            || true

          fetch_binance \
            "BTCUSDT" \
            "state/evidence/binance_btc.json" \
            || true

          # ========================================================
          # OKX FETCH
          # ========================================================

          fetch_okx() {
            local instrument="$1"
            local output="$2"

            if curl -fsS \
              --retry 3 \
              --retry-delay 1 \
              --connect-timeout 10 \
              --max-time 20 \
              "https://www.okx.com/api/v5/market/ticker?instId=${instrument}" \
              > "$output"
            then

              jq empty "$output"

              jq '
                if
                  (.code // "1") == "0"
                  and ((.data // []) | length) > 0
                  and (.data[0].last // null) != null
                then

                  .data[0] as $d |

                  {
                    available: true,

                    symbol: (
                      $d.instId
                      // null
                    ),

                    price: (
                      $d.last
                      | tonumber
                    ),

                    change_24h_pct: (
                      if
                        ($d.open24h // "") != ""
                      then
                        (
                          (
                            ($d.last | tonumber)
                            -
                            ($d.open24h | tonumber)
                          )
                          /
                          ($d.open24h | tonumber)
                        ) * 100
                      else
                        null
                      end
                    ),

                    volume_24h: (
                      if
                        ($d.vol24h // "") != ""
                      then
                        ($d.vol24h | tonumber)
                      else
                        null
                      end
                    ),

                    timestamp_ms: (
                      if
                        ($d.ts // "") != ""
                      then
                        ($d.ts | tonumber)
                      else
                        null
                      end
                    )
                  }

                else

                  {
                    available: false,
                    symbol: null,
                    price: null,
                    change_24h_pct: null,
                    volume_24h: null,
                    timestamp_ms: null,
                    error: "invalid_okx_response"
                  }

                end
              ' "$output" \
              > "${output}.normalized"

              mv "${output}.normalized" "$output"

              return 0

            else

              jq -n \
                --arg instrument "$instrument" \
                '{
                  available: false,
                  symbol: $instrument,
                  price: null,
                  change_24h_pct: null,
                  volume_24h: null,
                  timestamp_ms: null,
                  error: "http_request_failed"
                }' \
                > "$output"

              return 1

            fi
          }

          echo ""
          echo "OKX"

          fetch_okx \
            "VIRTUAL-USDT" \
            "state/evidence/okx_virtual.json" \
            || true

          fetch_okx \
            "FET-USDT" \
            "state/evidence/okx_fet.json" \
            || true

          fetch_okx \
            "KITE-USDT" \
            "state/evidence/okx_kite.json" \
            || true

          fetch_okx \
            "BTC-USDT" \
            "state/evidence/okx_btc.json" \
            || true

          # ========================================================
          # GLOBAL HEALTH
          #
          # Each file is processed independently.
          # No large --argjson chain.
          # ========================================================

          add_global_health() {
            local file="$1"

            local available
            local timestamp_ms
            local timestamp_epoch
            local age
            local freshness

            available="$(
              jq -r '.available // false' "$file"
            )"

            if [ "$available" != "true" ]; then

              jq \
                '. + {
                  freshness: "unavailable",
                  age_seconds: null
                }' \
                "$file" \
                > "${file}.tmp"

              mv "${file}.tmp" "$file"

              return
            fi

            timestamp_ms="$(
              jq -r '.timestamp_ms // empty' "$file"
            )"

            if [ -z "$timestamp_ms" ]; then

              jq \
                '. + {
                  freshness: "unknown",
                  age_seconds: null
                }' \
                "$file" \
                > "${file}.tmp"

              mv "${file}.tmp" "$file"

              return
            fi

            timestamp_epoch=$((timestamp_ms / 1000))
            age=$((current_epoch - timestamp_epoch))

            if [ "$age" -lt 0 ]; then
              age=0
            fi

            freshness="$(
              classify_global_age "$age"
            )"

            jq \
              --arg freshness "$freshness" \
              --argjson age "$age" \
              '
              . + {
                freshness: $freshness,
                age_seconds: $age
              }
              ' \
              "$file" \
              > "${file}.tmp"

            mv "${file}.tmp" "$file"
          }

          add_global_health state/evidence/binance_virtual.json
          add_global_health state/evidence/binance_fet.json
          add_global_health state/evidence/binance_kite.json
          add_global_health state/evidence/binance_btc.json

          add_global_health state/evidence/okx_virtual.json
          add_global_health state/evidence/okx_fet.json
          add_global_health state/evidence/okx_kite.json
          add_global_health state/evidence/okx_btc.json

          # ========================================================
          # CREATE GLOBAL EVIDENCE
          # ========================================================

          jq -n \
            --slurpfile paribu state/evidence/paribu.json \
            --slurpfile bv state/evidence/binance_virtual.json \
            --slurpfile bf state/evidence/binance_fet.json \
            --slurpfile bk state/evidence/binance_kite.json \
            --slurpfile bb state/evidence/binance_btc.json \
            --slurpfile ov state/evidence/okx_virtual.json \
            --slurpfile of state/evidence/okx_fet.json \
            --slurpfile ok state/evidence/okx_kite.json \
            --slurpfile ob state/evidence/okx_btc.json \
            --arg captured_at "$captured_at" \
            '
            ($paribu[0]) as $p |
            ($bv[0]) as $bv0 |
            ($bf[0]) as $bf0 |
            ($bk[0]) as $bk0 |
            ($bb[0]) as $bb0 |
            ($ov[0]) as $ov0 |
            ($of[0]) as $of0 |
            ($ok[0]) as $ok0 |
            ($ob[0]) as $ob0 |

            def usable($x):
              ($x.available == true)
              and ($x.price != null)
              and ($x.change_24h_pct != null);

            def direction($x):
              if
                $x.change_24h_pct == null
              then
                "unknown"
              elif
                $x.change_24h_pct > 0.25
              then
                "up"
              elif
                $x.change_24h_pct < -0.25
              then
                "down"
              else
                "flat"
              end;

            def global_direction($a; $b):
              if usable($a) and usable($b) then

                if
                  $a.change_24h_pct > 0.25
                  and
                  $b.change_24h_pct > 0.25
                then
                  "up"

                elif
                  $a.change_24h_pct < -0.25
                  and
                  $b.change_24h_pct < -0.25
                then
                  "down"

                else
                  "mixed"
                end

              elif usable($a) then
                direction($a)

              elif usable($b) then
                direction($b)

              else
                "unknown"
              end;

            def agreement($a; $b):
              if usable($a) and usable($b) then
                (
                  (
                    $a.change_24h_pct
                    -
                    $b.change_24h_pct
                  )
                  | abs
                ) <= 1.0
              else
                false
              end;

            def fresh($x):
              $x.available == true
              and
              (
                $x.freshness == "fresh"
                or
                $x.freshness == "stale_warning"
              );

            def confidence($a; $b; $btc):
              (
                global_direction($a; $b)
              ) as $direction |

              if
                fresh($a)
                and
                fresh($b)
                and
                agreement($a; $b)
                and
                (
                  $direction == "up"
                  or
                  $direction == "down"
                )
                and
                $btc
              then
                "HIGH"

              elif
                (
                  fresh($a)
                  or
                  fresh($b)
                )
                and
                (
                  $direction == "up"
                  or
                  $direction == "down"
                )
              then
                "MEDIUM"

              else
                "LOW"
              end;

            {
              captured_at: $captured_at,

              freshness_policy: {
                paribu: {
                  fresh_max_seconds: 1200,
                  stale_warning_max_seconds: 1800,
                  degraded_max_seconds: 2700,
                  stale_after_seconds: 2700
                },

                global: {
                  fresh_max_seconds: 300,
                  stale_warning_max_seconds: 900,
                  degraded_max_seconds: 1800,
                  stale_after_seconds: 1800
                }
              },

              sources: {

                paribu: $p,

                binance: {
                  VIRTUAL: $bv0,
                  FET: $bf0,
                  KITE: $bk0,
                  BTC: $bb0
                },

                okx: {
                  VIRTUAL: $ov0,
                  FET: $of0,
                  KITE: $ok0,
                  BTC: $ob0
                }
              },

              coins: {

                VIRTUAL: {
                  local: $p.markets.VIRTUAL,

                  global: {
                    binance: $bv0,
                    okx: $ov0
                  },

                  evidence: {
                    direction:
                      global_direction($bv0; $ov0),

                    exchange_agreement:
                      agreement($bv0; $ov0),

                    confidence:
                      confidence(
                        $bv0;
                        $ov0;
                        (
                          fresh($bb0)
                          or
                          fresh($ob0)
                        )
                      )
                  }
                },

                FET: {
                  local: $p.markets.FET,

                  global: {
                    binance: $bf0,
                    okx: $of0
                  },

                  evidence: {
                    direction:
                      global_direction($bf0; $of0),

                    exchange_agreement:
                      agreement($bf0; $of0),

                    confidence:
                      confidence(
                        $bf0;
                        $of0;
                        (
                          fresh($bb0)
                          or
                          fresh($ob0)
                        )
                      )
                  }
                },

                KITE: {
                  local: $p.markets.KITE,

                  global: {
                    binance: $bk0,
                    okx: $ok0
                  },

                  evidence: {
                    direction:
                      global_direction($bk0; $ok0),

                    exchange_agreement:
                      agreement($bk0; $ok0),

                    confidence:
                      confidence(
                        $bk0;
                        $ok0;
                        (
                          fresh($bb0)
                          or
                          fresh($ob0)
                        )
                      )
                  }
                }
              },

              methodology: {
                local_market:
                  "Paribu provides TRY-denominated local-market evidence.",

                global_market:
                  "Binance and OKX provide independent USDT-denominated global-market evidence.",

                benchmark:
                  "BTC/USDT is used as the broad crypto-market benchmark.",

                local_global_price:
                  "Paribu TRY prices are not directly compared numerically with global USDT prices.",

                volume:
                  "Volume is evaluated within each market and is not treated as directly interchangeable across exchanges.",

                confidence:
                  "HIGH requires fresh Binance and OKX evidence, directional agreement and a fresh BTC benchmark.",

                unavailable:
                  "Unavailable data is not interpreted as negative market evidence.",

                stale:
                  "Stale evidence reduces confidence but does not automatically stop collection.",

                decision:
                  "This layer produces evidence only. It does not make trading decisions."
              }
            }
            ' \
            > state/global_evidence.json

          # ========================================================
          # FINAL VALIDATION
          # ========================================================

          jq empty state/global_evidence.json

          echo ""
          echo "========================================"
          echo "GLOBAL EVIDENCE SUMMARY"
          echo "========================================"

          jq '
            {
              captured_at,
              freshness_policy,

              paribu:
                .sources.paribu,

              binance:
                {
                  VIRTUAL: .sources.binance.VIRTUAL,
                  FET: .sources.binance.FET,
                  KITE: .sources.binance.KITE,
                  BTC: .sources.binance.BTC
                },

              okx:
                {
                  VIRTUAL: .sources.okx.VIRTUAL,
                  FET: .sources.okx.FET,
                  KITE: .sources.okx.KITE,
                  BTC: .sources.okx.BTC
                },

              evidence:
                {
                  VIRTUAL: .coins.VIRTUAL.evidence,
                  FET: .coins.FET.evidence,
                  KITE: .coins.KITE.evidence
                }
            }
          ' state/global_evidence.json

      # ============================================================
      # COMMIT EVIDENCE
      # ============================================================

      - name: Commit global evidence
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state/evidence/
          git add state/global_evidence.json

          if git diff --cached --quiet; then
            echo "No global evidence changes."
            exit 0
          fi

          git commit -m "Rebuild global evidence pipeline"

          git fetch origin main
          git rebase origin/main

          git push origin HEAD:main
