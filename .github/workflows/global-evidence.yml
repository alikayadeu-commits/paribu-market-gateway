name: Global Evidence Layer

on:
  workflow_run:
    workflows:
      - "Adaptive Event Detector"
    types:
      - completed

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: global-evidence
  cancel-in-progress: false

jobs:
  collect:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Collect and validate global evidence
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p state

          captured_at="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"

          echo "========================================"
          echo "GLOBAL EVIDENCE LAYER"
          echo "========================================"
          echo "Captured at: ${captured_at}"

          # =========================================================
          # HELPERS
          # =========================================================

          fetch_json() {
            local url="$1"

            curl -fsS \
              --retry 3 \
              --retry-delay 1 \
              --connect-timeout 10 \
              --max-time 20 \
              "$url"
          }

          classify_age() {
            local age="$1"

            if [ "$age" -le 300 ]; then
              echo "fresh"
            elif [ "$age" -le 900 ]; then
              echo "stale_warning"
            elif [ "$age" -le 1800 ]; then
              echo "degraded"
            else
              echo "stale"
            fi
          }

          # =========================================================
          # PARIBU
          # =========================================================

          if [ ! -f data/latest.json ]; then
            echo "ERROR: data/latest.json not found."
            exit 1
          fi

          paribu_latest="$(cat data/latest.json)"

          paribu_ok="$(
            jq -r '.ok // false' <<< "$paribu_latest"
          )"

          paribu_fetched_at="$(
            jq -r '.fetched_at // empty' <<< "$paribu_latest"
          )"

          if [ "$paribu_ok" != "true" ]; then
            echo "WARNING: Paribu snapshot reports unhealthy."
          fi

          if [ -z "$paribu_fetched_at" ]; then
            echo "ERROR: Paribu fetched_at is missing."
            exit 1
          fi

          current_epoch="$(date -u +%s)"
          paribu_epoch="$(date -u -d "$paribu_fetched_at" +%s)"

          paribu_age_seconds=$((current_epoch - paribu_epoch))

          if [ "$paribu_age_seconds" -lt 0 ]; then
            paribu_age_seconds=0
          fi

          paribu_freshness="$(classify_age "$paribu_age_seconds")"

          echo "Paribu snapshot: ${paribu_fetched_at}"
          echo "Paribu age: ${paribu_age_seconds}s"
          echo "Paribu freshness: ${paribu_freshness}"

          # =========================================================
          # PARIBU VALUES
          # =========================================================

          paribu_virtual_price="$(
            jq -r '.markets.virtual_tl.ticker[0].last // null' \
            <<< "$paribu_latest"
          )"

          paribu_fet_price="$(
            jq -r '.markets.fet_tl.ticker[0].last // null' \
            <<< "$paribu_latest"
          )"

          paribu_kite_price="$(
            jq -r '.markets.kite_tl.ticker[0].last // null' \
            <<< "$paribu_latest"
          )"

          paribu_virtual_volume="$(
            jq -r '.markets.virtual_tl.ticker[0].volume // null' \
            <<< "$paribu_latest"
          )"

          paribu_fet_volume="$(
            jq -r '.markets.fet_tl.ticker[0].volume // null' \
            <<< "$paribu_latest"
          )"

          paribu_kite_volume="$(
            jq -r '.markets.kite_tl.ticker[0].volume // null' \
            <<< "$paribu_latest"
          )"

          # =========================================================
          # BINANCE
          # =========================================================

          binance_virtual='{}'
          binance_fet='{}'
          binance_kite='{}'
          binance_btc='{}'

          binance_virtual_status="unavailable"
          binance_fet_status="unavailable"
          binance_kite_status="unavailable"
          binance_btc_status="unavailable"

          if binance_virtual="$(
            fetch_json \
            "https://api.binance.com/api/v3/ticker/24hr?symbol=VIRTUALUSDT"
          )"; then
            binance_virtual_status="available"
          fi

          if binance_fet="$(
            fetch_json \
            "https://api.binance.com/api/v3/ticker/24hr?symbol=FETUSDT"
          )"; then
            binance_fet_status="available"
          fi

          if binance_kite="$(
            fetch_json \
            "https://api.binance.com/api/v3/ticker/24hr?symbol=KITEUSDT"
          )"; then
            binance_kite_status="available"
          fi

          if binance_btc="$(
            fetch_json \
            "https://api.binance.com/api/v3/ticker/24hr?symbol=BTCUSDT"
          )"; then
            binance_btc_status="available"
          fi

          echo "Binance VIRTUAL: ${binance_virtual_status}"
          echo "Binance FET: ${binance_fet_status}"
          echo "Binance KITE: ${binance_kite_status}"
          echo "Binance BTC: ${binance_btc_status}"

          # =========================================================
          # OKX
          # =========================================================

          okx_virtual='{}'
          okx_fet='{}'
          okx_kite='{}'
          okx_btc='{}'

          okx_virtual_status="unavailable"
          okx_fet_status="unavailable"
          okx_kite_status="unavailable"
          okx_btc_status="unavailable"

          if okx_virtual="$(
            fetch_json \
            "https://www.okx.com/api/v5/market/ticker?instId=VIRTUAL-USDT"
          )"; then
            okx_virtual_status="available"
          fi

          if okx_fet="$(
            fetch_json \
            "https://www.okx.com/api/v5/market/ticker?instId=FET-USDT"
          )"; then
            okx_fet_status="available"
          fi

          if okx_kite="$(
            fetch_json \
            "https://www.okx.com/api/v5/market/ticker?instId=KITE-USDT"
          )"; then
            okx_kite_status="available"
          fi

          if okx_btc="$(
            fetch_json \
            "https://www.okx.com/api/v5/market/ticker?instId=BTC-USDT"
          )"; then
            okx_btc_status="available"
          fi

          echo "OKX VIRTUAL: ${okx_virtual_status}"
          echo "OKX FET: ${okx_fet_status}"
          echo "OKX KITE: ${okx_kite_status}"
          echo "OKX BTC: ${okx_btc_status}"

          # =========================================================
          # NORMALIZE BINANCE
          # =========================================================

          normalize_binance() {
            local raw="$1"

            jq -c '
              if
                (.symbol // null) == null
                or (.lastPrice // null) == null
              then
                {
                  available: false,
                  symbol: null,
                  price: null,
                  change_24h_pct: null,
                  volume_24h: null,
                  quote_volume_24h: null,
                  timestamp_ms: null
                }
              else
                {
                  available: true,
                  symbol: .symbol,
                  price: (.lastPrice | tonumber),
                  change_24h_pct: (.priceChangePercent | tonumber),
                  volume_24h: (.volume | tonumber),
                  quote_volume_24h: (.quoteVolume | tonumber),
                  timestamp_ms: (
                    if .closeTime != null
                    then (.closeTime | tonumber)
                    else null
                    end
                  )
                }
              end
            ' <<< "$raw"
          }

          # =========================================================
          # NORMALIZE OKX
          # =========================================================

          normalize_okx() {
            local raw="$1"

            jq -c '
              if
                (.code // "1") != "0"
                or ((.data // []) | length) == 0
                or (.data[0].last // null) == null
              then
                {
                  available: false,
                  symbol: null,
                  price: null,
                  change_24h_pct: null,
                  volume_24h: null,
                  quote_volume_24h: null,
                  timestamp_ms: null
                }
              else
                .data[0] as $d |
                {
                  available: true,

                  symbol: ($d.instId // null),

                  price: (
                    ($d.last // "0") | tonumber
                  ),

                  change_24h_pct: (
                    if ($d.open24h // "") != "" then
                      (
                        (
                          ($d.last | tonumber)
                          -
                          ($d.open24h | tonumber)
                        )
                        /
                        ($d.open24h | tonumber)
                      ) * 100
                    else
                      null
                    end
                  ),

                  volume_24h: (
                    if ($d.vol24h // "") != "" then
                      ($d.vol24h | tonumber)
                    else
                      null
                    end
                  ),

                  quote_volume_24h: null,

                  timestamp_ms: (
                    if ($d.ts // "") != "" then
                      ($d.ts | tonumber)
                    else
                      null
                    end
                  )
                }
              end
            ' <<< "$raw"
          }

          bv="$(normalize_binance "$binance_virtual")"
          bf="$(normalize_binance "$binance_fet")"
          bk="$(normalize_binance "$binance_kite")"
          bb="$(normalize_binance "$binance_btc")"

          ov="$(normalize_okx "$okx_virtual")"
          of="$(normalize_okx "$okx_fet")"
          ok="$(normalize_okx "$okx_kite")"
          ob="$(normalize_okx "$okx_btc")"

          # =========================================================
          # GLOBAL TIMESTAMP HEALTH
          # =========================================================

          global_source_health() {
            local raw="$1"

            jq -c \
              --argjson now "$current_epoch" \
              '
              if .available != true then
                {
                  available: false,
                  freshness: "unavailable",
                  age_seconds: null
                }

              elif .timestamp_ms == null then
                {
                  available: true,
                  freshness: "unknown",
                  age_seconds: null
                }

              else
                (.timestamp_ms / 1000 | floor) as $ts |
                ($now - $ts) as $age |

                {
                  available: true,

                  freshness:
                    if $age <= 300 then
                      "fresh"
                    elif $age <= 900 then
                      "stale_warning"
                    elif $age <= 1800 then
                      "degraded"
                    else
                      "stale"
                    end,

                  age_seconds:
                    if $age < 0 then
                      0
                    else
                      $age
                    end
                }
              end
              '
            <<< "$raw"
          }

          bv_health="$(global_source_health "$bv")"
          bf_health="$(global_source_health "$bf")"
          bk_health="$(global_source_health "$bk")"
          bb_health="$(global_source_health "$bb")"

          ov_health="$(global_source_health "$ov")"
          of_health="$(global_source_health "$of")"
          ok_health="$(global_source_health "$ok")"
          ob_health="$(global_source_health "$ob")"

          echo "Binance VIRTUAL health: ${bv_health}"
          echo "Binance FET health: ${bf_health}"
          echo "Binance KITE health: ${bk_health}"
          echo "Binance BTC health: ${bb_health}"

          echo "OKX VIRTUAL health: ${ov_health}"
          echo "OKX FET health: ${of_health}"
          echo "OKX KITE health: ${ok_health}"
          echo "OKX BTC health: ${ob_health}"

          # =========================================================
          # BUILD GLOBAL EVIDENCE JSON
          # =========================================================

          jq -n \
            --arg captured_at "$captured_at" \
            --arg paribu_fetched_at "$paribu_fetched_at" \
            --arg paribu_freshness "$paribu_freshness" \
            --argjson paribu_age "$paribu_age_seconds" \
            --argjson pv "$paribu_virtual_price" \
            --argjson pf "$paribu_fet_price" \
            --argjson pk "$paribu_kite_price" \
            --argjson pvv "$paribu_virtual_volume" \
            --argjson pfv "$paribu_fet_volume" \
            --argjson pkv "$paribu_kite_volume" \
            --argjson bv "$bv" \
            --argjson bf "$bf" \
            --argjson bk "$bk" \
            --argjson bb "$bb" \
            --argjson ov "$ov" \
            --argjson of "$of" \
            --argjson ok "$ok" \
            --argjson ob "$ob" \
            --argjson bv_health "$bv_health" \
            --argjson bf_health "$bf_health" \
            --argjson bk_health "$bk_health" \
            --argjson bb_health "$bb_health" \
            --argjson ov_health "$ov_health" \
            --argjson of_health "$of_health" \
            --argjson ok_health "$ok_health" \
            --argjson ob_health "$ob_health" \
            --arg bv_status "$binance_virtual_status" \
            --arg bf_status "$binance_fet_status" \
            --arg bk_status "$binance_kite_status" \
            --arg bb_status "$binance_btc_status" \
            --arg ov_status "$okx_virtual_status" \
            --arg of_status "$okx_fet_status" \
            --arg ok_status "$okx_kite_status" \
            --arg ob_status "$okx_btc_status" \
            '
            def valid_price($x):
              ($x.available == true)
              and ($x.price != null)
              and ($x.price > 0);

            def usable_change($x):
              valid_price($x)
              and ($x.change_24h_pct != null);

            def global_direction($a; $b):
              if usable_change($a) and usable_change($b) then

                if
                  ($a.change_24h_pct > 0.25)
                  and
                  ($b.change_24h_pct > 0.25)
                then
                  "up"

                elif
                  ($a.change_24h_pct < -0.25)
                  and
                  ($b.change_24h_pct < -0.25)
                then
                  "down"

                else
                  "mixed"
                end

              elif usable_change($a) then

                if $a.change_24h_pct > 0.25 then
                  "up"
                elif $a.change_24h_pct < -0.25 then
                  "down"
                else
                  "flat"
                end

              elif usable_change($b) then

                if $b.change_24h_pct > 0.25 then
                  "up"
                elif $b.change_24h_pct < -0.25 then
                  "down"
                else
                  "flat"
                end

              else
                "unknown"
              end;

            def agreement($a; $b):
              if usable_change($a) and usable_change($b) then
                (
                  ($a.change_24h_pct - $b.change_24h_pct)
                  | abs
                ) <= 1.0
              else
                false
              end;

            def source_fresh($h):
              ($h.available == true)
              and
              (
                $h.freshness == "fresh"
                or
                $h.freshness == "stale_warning"
              );

            def directional($direction):
              (
                $direction == "up"
                or
                $direction == "down"
              );

            def confidence(
              $binance_health;
              $okx_health;
              $agreement_value;
              $direction_value;
              $btc_available
            ):

              if
                source_fresh($binance_health)
                and source_fresh($okx_health)
                and $agreement_value
                and directional($direction_value)
                and $btc_available
              then
                "HIGH"

              elif
                (
                  source_fresh($binance_health)
                  or
                  source_fresh($okx_health)
                )
                and
                directional($direction_value)
              then
                "MEDIUM"

              else
                "LOW"
              end;

            {
              captured_at: $captured_at,

              freshness_policy: {
                fresh_max_seconds: 300,
                stale_warning_max_seconds: 900,
                degraded_max_seconds: 1800,
                stale_after_seconds: 1800
              },

              source_health: {

                paribu: {
                  available: ($paribu_freshness != "stale"),
                  fetched_at: $paribu_fetched_at,
                  age_seconds: $paribu_age,
                  freshness: $paribu_freshness
                },

                binance: {

                  VIRTUAL: {
                    status: $bv_status,
                    health: $bv_health
                  },

                  FET: {
                    status: $bf_status,
                    health: $bf_health
                  },

                  KITE: {
                    status: $bk_status,
                    health: $bk_health
                  },

                  BTC: {
                    status: $bb_status,
                    health: $bb_health
                  }
                },

                okx: {

                  VIRTUAL: {
                    status: $ov_status,
                    health: $ov_health
                  },

                  FET: {
                    status: $of_status,
                    health: $of_health
                  },

                  KITE: {
                    status: $ok_status,
                    health: $ok_health
                  },

                  BTC: {
                    status: $ob_status,
                    health: $ob_health
                  }
                }
              },

              benchmarks: {
                BTC: {
                  binance: $bb,
                  okx: $ob
                }
              },

              coins: {

                VIRTUAL: {

                  local: {
                    exchange: "Paribu",
                    quote_currency: "TRY",
                    price: $pv,
                    volume_24h: $pvv
                  },

                  global: {
                    binance: $bv,
                    okx: $ov
                  },

                  relationship: {

                    global_direction:
                      global_direction($bv; $ov),

                    cross_exchange_agreement:
                      agreement($bv; $ov),

                    global_confidence:
                      confidence(
                        $bv_health;
                        $ov_health;
                        agreement($bv; $ov);
                        global_direction($bv; $ov);
                        (
                          source_fresh($bb_health)
                          or
                          source_fresh($ob_health)
                        )
                      )
                  }
                },

                FET: {

                  local: {
                    exchange: "Paribu",
                    quote_currency: "TRY",
                    price: $pf,
                    volume_24h: $pfv
                  },

                  global: {
                    binance: $bf,
                    okx: $of
                  },

                  relationship: {

                    global_direction:
                      global_direction($bf; $of),

                    cross_exchange_agreement:
                      agreement($bf; $of),

                    global_confidence:
                      confidence(
                        $bf_health;
                        $of_health;
                        agreement($bf; $of);
                        global_direction($bf; $of);
                        (
                          source_fresh($bb_health)
                          or
                          source_fresh($ob_health)
                        )
                      )
                  }
                },

                KITE: {

                  local: {
                    exchange: "Paribu",
                    quote_currency: "TRY",
                    price: $pk,
                    volume_24h: $pkv
                  },

                  global: {
                    binance: $bk,
                    okx: $ok
                  },

                  relationship: {

                    global_direction:
                      global_direction($bk; $ok),

                    cross_exchange_agreement:
                      agreement($bk; $ok),

                    global_confidence:
                      confidence(
                        $bk_health;
                        $ok_health;
                        agreement($bk; $ok);
                        global_direction($bk; $ok);
                        (
                          source_fresh($bb_health)
                          or
                          source_fresh($ob_health)
                        )
                      )
                  }
                }
              }
            }
            ' > state/global_evidence.json

          echo "========================================"
          echo "GLOBAL EVIDENCE COMPLETE"
          echo "========================================"

          jq '
            {
              captured_at,
              paribu: .source_health.paribu,
              binance: .source_health.binance,
              okx: .source_health.okx,
              VIRTUAL: .coins.VIRTUAL.relationship,
              FET: .coins.FET.relationship,
              KITE: .coins.KITE.relationship
            }
          ' state/global_evidence.json

      - name: Commit global evidence
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state/global_evidence.json

          if git diff --cached --quiet; then
            echo "No global evidence changes to commit."
            exit 0
          fi

          git commit -m "Update global evidence state"
          git push
