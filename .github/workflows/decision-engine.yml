name: Adaptive Decision Engine

on:
  workflow_run:
    workflows:
      - "Historical Orderbook Impact"
      - "Paribu Market Data"
    types:
      - completed
      
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: adaptive-decision-engine
  cancel-in-progress: false

jobs:
  evidence:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # BUILD LOCAL EVIDENCE SNAPSHOT
      # ============================================================

      - name: Build local evidence snapshot
        shell: python
        run: |

          import json
          from pathlib import Path
          from datetime import datetime, timezone


          # ========================================================
          # CONFIGURATION
          # ========================================================

          COINS = {
              "VIRTUAL": "virtual_tl",
              "FET": "fet_tl",
              "KITE": "kite_tl",
              "ATH": "ath_tl",
          }


          # ========================================================
          # PATHS
          # ========================================================

          latest_path = Path(
              "data/latest.json"
          )

          lifecycle_path = Path(
              "state/lifecycle.json"
          )

          events_path = Path(
              "state/events.jsonl"
          )

          p5_path = Path(
              "state/p5_v2.json"
          )

          historical_impact_path = Path(
              "state/historical_orderbook_impact.json"
          )

          output_path = Path(
              "state/decision.json"
          )


          # ========================================================
          # WORKFLOW SOURCE
          # ========================================================

          workflow_source = (
              "manual"
              if "${{ github.event_name }}" == "workflow_dispatch"
              else "${{ github.event.workflow_run.name }}"
          )


          print(
              f"Adaptive Decision Engine triggered by: "
              f"{workflow_source}"
          )


          # ========================================================
          # LOAD PARIBU SNAPSHOT
          # ========================================================

          if not latest_path.exists():

              print(
                  "Paribu snapshot unavailable."
              )

              raise SystemExit(0)


          latest = json.loads(
              latest_path.read_text(
                  encoding="utf-8"
              )
          )


          if latest.get("ok") is not True:

              print(
                  "Paribu data invalid."
              )

              raise SystemExit(0)


          fetched_at = latest.get(
              "fetched_at"
          )


          if not fetched_at:

              print(
                  "Missing fetched_at."
              )

              raise SystemExit(0)


          fetched_dt = datetime.fromisoformat(
              fetched_at.replace(
                  "Z",
                  "+00:00"
              )
          )


          now = datetime.now(
              timezone.utc
          )


          age_seconds = (
              now - fetched_dt
          ).total_seconds()


          if age_seconds < -300:

              print(
                  "Future-dated snapshot."
              )

              raise SystemExit(0)


          if age_seconds > 45 * 60:

              print(
                  f"Stale Paribu data: "
                  f"{age_seconds:.0f}s."
              )

              raise SystemExit(0)


          # ========================================================
          # LOAD LIFECYCLE
          # ========================================================

          lifecycle = {}


          if lifecycle_path.exists():

              try:

                  lifecycle = json.loads(
                      lifecycle_path.read_text(
                          encoding="utf-8"
                      )
                  )

              except (
                  OSError,
                  json.JSONDecodeError
              ):

                  lifecycle = {}


          # ========================================================
          # LOAD EVENTS
          # ========================================================

          events = []


          if events_path.exists():

              for line in events_path.read_text(
                  encoding="utf-8"
              ).splitlines():

                  if not line.strip():
                      continue

                  try:

                      events.append(
                          json.loads(line)
                      )

                  except json.JSONDecodeError:

                      continue


          latest_events = {}


          for event in events:

              coin = event.get(
                  "coin"
              )


              if coin not in COINS:
                  continue


              event_time = event.get(
                  "fetched_at"
              )


              if (
                  event_time
                  and event_time <= fetched_at
              ):

                  latest_events[coin] = event


          # ========================================================
          # LOAD P5 V2
          # ========================================================

          p5 = {}


          if p5_path.exists():

              try:

                  p5 = json.loads(
                      p5_path.read_text(
                          encoding="utf-8"
                      )
                  )

              except (
                  OSError,
                  json.JSONDecodeError
              ):

                  p5 = {}


          p5_version = p5.get(
              "version"
          )

          p5_status = p5.get(
              "status"
          )

          p5_snapshot_at = p5.get(
              "snapshot_at"
          )

          p5_data_health = p5.get(
              "data_health",
              {}
          )


          # ========================================================
          # P5 DATA HEALTH CHECK
          # ========================================================

          p5_healthy = (
              p5_status == "FROZEN"
              and
              p5_data_health.get(
                  "healthy"
              ) is True
          )


          p5_snapshot_matches = (
              p5_snapshot_at
              == fetched_at
          )


          p5_available = (
              p5_healthy
              and
              p5_snapshot_matches
          )


          # ========================================================
          # LOAD HISTORICAL ORDERBOOK IMPACT
          # ========================================================

          historical_impact = {}


          if historical_impact_path.exists():

              try:

                  historical_impact = json.loads(
                      historical_impact_path.read_text(
                          encoding="utf-8"
                      )
                  )

              except (
                  OSError,
                  json.JSONDecodeError
              ):

                  historical_impact = {}


          historical_method = (
              historical_impact.get(
                  "method"
              )
          )


          historical_snapshot_count = (
              historical_impact.get(
                  "historical_snapshot_count"
              )
          )


          historical_available = (
              historical_method
              == "historical_orderbook_impact_v2"
          )


          # ========================================================
          # HELPERS
          # ========================================================

          def number(value):

              try:

                  return float(value)

              except (
                  TypeError,
                  ValueError
              ):

                  return None


          def market_data(market):

              return latest.get(
                  "markets",
                  {}
              ).get(
                  market
              )


          def current_price(market):

              data = market_data(
                  market
              )


              try:

                  return number(
                      data["ticker"][0]["last"]
                  )

              except (
                  KeyError,
                  TypeError,
                  IndexError
              ):

                  return None


          def current_volume(market):

              data = market_data(
                  market
              )


              try:

                  return number(
                      data["ticker"][0]["volume"]
                  )

              except (
                  KeyError,
                  TypeError,
                  IndexError
              ):

                  return None


          def orderbook_pressure(market):

              data = market_data(
                  market
              )


              try:

                  bids = (
                      data["orderbook"]["bids"]
                  )

                  asks = (
                      data["orderbook"]["asks"]
                  )


                  bid_volume = 0.0
                  ask_volume = 0.0


                  for item in bids:

                      price = number(
                          item[0]
                      )

                      quantity = number(
                          item[1]
                      )


                      if (
                          price is not None
                          and
                          quantity is not None
                      ):

                          bid_volume += (
                              price
                              * quantity
                          )


                  for item in asks:

                      price = number(
                          item[0]
                      )

                      quantity = number(
                          item[1]
                      )


                      if (
                          price is not None
                          and
                          quantity is not None
                      ):

                          ask_volume += (
                              price
                              * quantity
                          )


                  total = (
                      bid_volume
                      + ask_volume
                  )


                  if total <= 0:

                      return "unknown"


                  ratio = (
                      bid_volume
                      / total
                  )


                  if ratio >= 0.60:

                      return "demand_heavy"


                  if ratio <= 0.40:

                      return "supply_heavy"


                  return "balanced"


              except (
                  KeyError,
                  TypeError,
                  IndexError,
                  ValueError
              ):

                  return "unknown"


          # ========================================================
          # OUTPUT HEADER
          # ========================================================

          output = {

              "generated_at":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "snapshot_at":
                  fetched_at,

              "workflow_source":
                  workflow_source,

              "mode":
                  "LOCAL_EVIDENCE_ONLY",

              "decision_authority":
                  "EXTERNAL_DECISION_SUPPORT_ENGINE",

              "p5_v2": {

                  "available":
                      p5_available,

                  "version":
                      p5_version,

                  "status":
                      p5_status,

                  "snapshot_at":
                      p5_snapshot_at,

                  "snapshot_matches":
                      p5_snapshot_matches,

                  "data_healthy":
                      p5_data_health.get(
                          "healthy",
                          False
                      ),
              },

              "historical_orderbook_impact": {

                  "available":
                      historical_available,

                  "method":
                      historical_method,

                  "historical_snapshot_count":
                      historical_snapshot_count,
              },

              "coins":
                  {}
          }


          # ========================================================
          # COIN EVIDENCE
          # ========================================================

          for coin, market in COINS.items():

              event = latest_events.get(
                  coin,
                  {}
              )


              lifecycle_item = (
                  lifecycle.get(
                      coin,
                      {}
                  )
              )


              price = current_price(
                  market
              )


              volume = current_volume(
                  market
              )


              pressure = orderbook_pressure(
                  market
              )


              # ----------------------------------------------------
              # P5 COIN OUTPUT
              # ----------------------------------------------------

              p5_coin = {}


              if p5_available:

                  p5_coin = (
                      p5.get(
                          "coins",
                          {}
                      ).get(
                          coin,
                          {}
                      )
                  )


              p5_state = p5_coin.get(
                  "state"
              )


              p5_actionable = (
                  p5_coin.get(
                      "actionable_transition",
                      False
                  )
              )


              p5_imbalance = (
                  p5_coin.get(
                      "imbalance",
                      {}
                  )
              )


              p5_bid_wall = (
                  p5_coin.get(
                      "bid_wall",
                      {}
                  )
              )


              p5_ask_wall = (
                  p5_coin.get(
                      "ask_wall",
                      {}
                  )
              )


              p5_horizon = (
                  p5_coin.get(
                      "prediction_horizon",
                      {}
                  )
              )


              p5_evidence = (
                  p5_coin.get(
                      "evidence",
                      {}
                  )
              )


              # ----------------------------------------------------
              # HISTORICAL ORDERBOOK IMPACT
              # ----------------------------------------------------

              historical_coin = {}


              if historical_available:

                  historical_coin = (
                      historical_impact.get(
                          "markets",
                          {}
                      ).get(
                          coin,
                          {}
                      )
                  )


              historical_buy_impact = (
                  historical_coin.get(
                      "historical_buy_impact",
                      {}
                  )
              )


              historical_sell_impact = (
                  historical_coin.get(
                      "historical_sell_impact",
                      {}
                  )
              )


              historical_buy_evidence = (
                  historical_coin.get(
                      "buy_evidence",
                      []
                  )
              )


              historical_sell_evidence = (
                  historical_coin.get(
                      "sell_evidence",
                      []
                  )
              )


              # ----------------------------------------------------
              # DECISION
              # ----------------------------------------------------

              # GitHub remains an evidence layer.
              #
              # Historical Orderbook Impact does NOT directly
              # create BUY / SELL decisions.
              #
              # P5 V2 does NOT directly create BUY / SELL
              # decisions.
              #
              # Final decision remains external and requires
              # combined analysis of:
              #
              # Paribu
              # + Event/Lifecycle
              # + P5 V2
              # + Historical Orderbook Impact
              # + Binance
              # + OKX


              output["coins"][coin] = {

                  # ------------------------------------------------
                  # CURRENT MARKET
                  # ------------------------------------------------

                  "price":
                      price,

                  "volume":
                      volume,

                  "orderbook_pressure":
                      pressure,


                  # ------------------------------------------------
                  # EXISTING EVENT EVIDENCE
                  # ------------------------------------------------

                  "last_event":
                      event.get(
                          "event"
                      ),

                  "event_detected_at":
                      event.get(
                          "detected_at"
                      ),

                  "event_fetched_at":
                      event.get(
                          "fetched_at"
                      ),

                  "event_previous_state":
                      event.get(
                          "previous_state"
                      ),

                  "event_current_state":
                      event.get(
                          "current_state"
                      ),

                  "event_reason":
                      event.get(
                          "reason"
                      ),


                  # ------------------------------------------------
                  # EXISTING LIFECYCLE
                  # ------------------------------------------------

                  "lifecycle_state":
                      lifecycle_item.get(
                          "state",
                          "UNKNOWN"
                      ),

                  "lifecycle_updated_at":
                      lifecycle_item.get(
                          "updated_at"
                      ),

                  "last_evidence_event":
                      lifecycle_item.get(
                          "last_evidence_event"
                      ),

                  "last_evidence_at":
                      lifecycle_item.get(
                          "last_evidence_at"
                      ),


                  # ------------------------------------------------
                  # P5 V2
                  # ------------------------------------------------

                  "p5_v2": {

                      "available":
                          p5_available,

                      "state":
                          p5_state,

                      "actionable_transition":
                          p5_actionable,

                      "imbalance":
                          p5_imbalance,

                      "bid_wall":
                          p5_bid_wall,

                      "ask_wall":
                          p5_ask_wall,

                      "prediction_horizon":
                          p5_horizon,

                      "evidence":
                          p5_evidence,
                  },


                  # ------------------------------------------------
                  # HISTORICAL ORDERBOOK IMPACT
                  # ------------------------------------------------

                  "historical_orderbook_impact": {

                      "available":
                          historical_available,

                      "historical_buy_impact":
                          historical_buy_impact,

                      "historical_sell_impact":
                          historical_sell_impact,

                      "historical_sample_count":
                          historical_coin.get(
                              "historical_sample_count"
                          ),

                      "lifecycle_count":
                          historical_coin.get(
                              "lifecycle_count"
                          ),

                      "current_relevant_buy_levels":
                          historical_coin.get(
                              "current_relevant_buy_levels"
                          ),

                      "current_relevant_sell_levels":
                          historical_coin.get(
                              "current_relevant_sell_levels"
                          ),

                      "current_buy_quantity":
                          historical_coin.get(
                              "current_buy_quantity"
                          ),

                      "current_sell_quantity":
                          historical_coin.get(
                              "current_sell_quantity"
                          ),

                      "buy_evidence":
                          historical_buy_evidence,

                      "sell_evidence":
                          historical_sell_evidence,
                  },


                  # ------------------------------------------------
                  # DECISION
                  # ------------------------------------------------

                  "decision":
                      "DEFERRED",

                  "decision_reason":
                      (
                          "Local evidence prepared. "
                          "P5 V2 and Historical Orderbook "
                          "Impact are included as evidence "
                          "layers. Final decision requires "
                          "combined analysis of Paribu, "
                          "Event/Lifecycle, P5 V2, "
                          "Historical Orderbook Impact, "
                          "Binance and OKX."
                      )
              }


          # ========================================================
          # WRITE
          # ========================================================

          output_path.parent.mkdir(
              parents=True,
              exist_ok=True
          )


          output_path.write_text(
              json.dumps(
                  output,
                  indent=2,
                  ensure_ascii=False
              ) + "\n",
              encoding="utf-8"
          )


          # ========================================================
          # CONSOLE OUTPUT
          # ========================================================

          print(
              "========================================"
          )

          print(
              "LOCAL EVIDENCE SNAPSHOT"
          )

          print(
              "========================================"
          )


          print(
              f"Workflow source: "
              f"{workflow_source}"
          )


          print(
              f"P5 V2 available: "
              f"{p5_available}"
          )


          print(
              f"P5 V2 snapshot: "
              f"{p5_snapshot_at}"
          )


          print(
              f"Historical Orderbook Impact available: "
              f"{historical_available}"
          )


          print(
              f"Historical method: "
              f"{historical_method}"
          )


          print(
              f"Historical snapshots: "
              f"{historical_snapshot_count}"
          )


          print(
              f"Paribu snapshot: "
              f"{fetched_at}"
          )


          print(
              f"Paribu snapshot age: "
              f"{age_seconds:.0f}s"
          )


          print()


          for coin, item in output[
              "coins"
          ].items():

              p5_item = item.get(
                  "p5_v2",
                  {}
              )

              historical_item = item.get(
                  "historical_orderbook_impact",
                  {}
              )


              print(

                  f"{coin}: "
                  f"event={item['last_event']} | "
                  f"lifecycle={item['lifecycle_state']} | "
                  f"pressure={item['orderbook_pressure']} | "
                  f"P5={p5_item.get('state')} | "
                  f"P5_actionable="
                  f"{p5_item.get('actionable_transition')} | "
                  f"Historical="
                  f"{historical_item.get('available')} | "
                  f"decision=DEFERRED"

              )


          print()

          print(
              "Final decision authority remains "
              "outside GitHub."
          )


      # ============================================================
      # COMMIT DECISION EVIDENCE
      # ============================================================

      - name: Commit local evidence
        shell: bash
        run: |

          set -euo pipefail


          git config user.name \
            "github-actions[bot]"


          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


                    git add state/decision.json

          if git diff --cached --quiet; then

            echo \
              "No local evidence changes."

            exit 0

          fi

          git commit \
            -m "Integrate P5 and historical orderbook evidence"

          for attempt in 1 2 3 4 5; do

            echo "Push attempt ${attempt}/5"

            git fetch origin main

            git rebase origin/main

            if git push origin HEAD:main; then

              echo "Push successful."

              exit 0

            fi

            echo "Push rejected because main changed concurrently."

            git rebase --abort || true

            sleep 2

          done

          echo "Failed to push after 5 attempts."

          exit 1
