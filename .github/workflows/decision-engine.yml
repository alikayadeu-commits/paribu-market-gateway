name: Adaptive Decision Engine

on:
  workflow_run:
    workflows:
      - "Adaptive Event Detector"
    types:
      - completed

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: adaptive-decision-engine
  cancel-in-progress: false

jobs:
  evidence:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build local evidence snapshot
        shell: python
        run: |
          import json
          from pathlib import Path
          from datetime import datetime, timezone

          COINS = {
              "VIRTUAL": "virtual_tl",
              "FET": "fet_tl",
              "KITE": "kite_tl",
              "ATH": "ath_tl",
          }

          latest_path = Path("data/latest.json")
          lifecycle_path = Path("state/lifecycle.json")
          events_path = Path("state/events.jsonl")
          output_path = Path("state/decision.json")

          # =========================================================
          # LOAD PARIBU SNAPSHOT
          # =========================================================

          if not latest_path.exists():
              print("Paribu snapshot unavailable.")
              raise SystemExit(0)

          latest = json.loads(
              latest_path.read_text(
                  encoding="utf-8"
              )
          )

          if latest.get("ok") is not True:
              print("Paribu data invalid.")
              raise SystemExit(0)

          fetched_at = latest.get("fetched_at")

          if not fetched_at:
              print("Missing fetched_at.")
              raise SystemExit(0)

          fetched_dt = datetime.fromisoformat(
              fetched_at.replace("Z", "+00:00")
          )

          now = datetime.now(timezone.utc)

          age_seconds = (
              now - fetched_dt
          ).total_seconds()

          if age_seconds < -300:
              print("Future-dated snapshot.")
              raise SystemExit(0)

          if age_seconds > 45 * 60:
              print(
                  f"Stale Paribu data: "
                  f"{age_seconds:.0f}s."
              )
              raise SystemExit(0)

          # =========================================================
          # LOAD LIFECYCLE
          # =========================================================

          lifecycle = {}

          if lifecycle_path.exists():
              try:
                  lifecycle = json.loads(
                      lifecycle_path.read_text(
                          encoding="utf-8"
                      )
                  )
              except (
                  OSError,
                  json.JSONDecodeError
              ):
                  lifecycle = {}

          # =========================================================
          # LOAD EVENTS
          # =========================================================

          events = []

          if events_path.exists():

              for line in events_path.read_text(
                  encoding="utf-8"
              ).splitlines():

                  if not line.strip():
                      continue

                  try:
                      events.append(
                          json.loads(line)
                      )
                  except json.JSONDecodeError:
                      continue

          latest_events = {}

          for event in events:

              coin = event.get("coin")

              if coin not in COINS:
                  continue

              event_time = event.get(
                  "fetched_at"
              )

              if (
                  event_time
                  and event_time <= fetched_at
              ):
                  latest_events[coin] = event

          # =========================================================
          # HELPERS
          # =========================================================

          def number(value):

              try:
                  return float(value)

              except (
                  TypeError,
                  ValueError
              ):

                  return None


          def market_data(market):

              return latest.get(
                  "markets",
                  {}
              ).get(
                  market
              )


          def current_price(market):

              data = market_data(market)

              try:
                  return number(
                      data["ticker"][0]["last"]
                  )

              except (
                  KeyError,
                  TypeError,
                  IndexError
              ):
                  return None


          def current_volume(market):

              data = market_data(market)

              try:
                  return number(
                      data["ticker"][0]["volume"]
                  )

              except (
                  KeyError,
                  TypeError,
                  IndexError
              ):
                  return None


          def orderbook_pressure(market):

              data = market_data(market)

              try:

                  bids = data["orderbook"]["bids"]
                  asks = data["orderbook"]["asks"]

                  bid_volume = 0.0
                  ask_volume = 0.0

                  for item in bids:

                      price = number(item[0])
                      quantity = number(item[1])

                      if (
                          price is not None
                          and quantity is not None
                      ):
                          bid_volume += (
                              price * quantity
                          )

                  for item in asks:

                      price = number(item[0])
                      quantity = number(item[1])

                      if (
                          price is not None
                          and quantity is not None
                      ):
                          ask_volume += (
                              price * quantity
                          )

                  total = (
                      bid_volume
                      + ask_volume
                  )

                  if total <= 0:
                      return "unknown"

                  ratio = (
                      bid_volume / total
                  )

                  if ratio >= 0.60:
                      return "demand_heavy"

                  if ratio <= 0.40:
                      return "supply_heavy"

                  return "balanced"

              except (
                  KeyError,
                  TypeError,
                  IndexError,
                  ValueError
              ):
                  return "unknown"

          # =========================================================
          # LOCAL EVIDENCE
          # =========================================================

          output = {
              "generated_at": datetime.now(
                  timezone.utc
              ).isoformat(),

              "snapshot_at": fetched_at,

              "mode": "LOCAL_EVIDENCE_ONLY",

              "decision_authority": (
                  "EXTERNAL_DECISION_SUPPORT_ENGINE"
              ),

              "coins": {}
          }

          for coin, market in COINS.items():

              event = latest_events.get(
                  coin,
                  {}
              )

              lifecycle_item = lifecycle.get(
                  coin,
                  {}
              )

              price = current_price(
                  market
              )

              volume = current_volume(
                  market
              )

              pressure = orderbook_pressure(
                  market
              )

              output["coins"][coin] = {

                  "price": price,

                  "volume": volume,

                  "orderbook_pressure": pressure,

                  "last_event": event.get(
                      "event"
                  ),

                  "event_detected_at": event.get(
                      "detected_at"
                  ),

                  "event_fetched_at": event.get(
                      "fetched_at"
                  ),

                  "event_previous_state": event.get(
                      "previous_state"
                  ),

                  "event_current_state": event.get(
                      "current_state"
                  ),

                  "event_reason": event.get(
                      "reason"
                  ),

                  "lifecycle_state": lifecycle_item.get(
                      "state",
                      "UNKNOWN"
                  ),

                  "lifecycle_updated_at": (
                      lifecycle_item.get(
                          "updated_at"
                      )
                  ),

                  "last_evidence_event": (
                      lifecycle_item.get(
                          "last_evidence_event"
                      )
                  ),

                  "last_evidence_at": (
                      lifecycle_item.get(
                          "last_evidence_at"
                      )
                  ),

                  # Explicitly prevent this layer
                  # from pretending to make a trade decision.
                  "decision": "DEFERRED",

                  "decision_reason": (
                      "Local evidence prepared. "
                      "Final decision requires "
                      "Paribu + Binance + OKX "
                      "combined analysis."
                  )
              }

          # =========================================================
          # WRITE
          # =========================================================

          output_path.parent.mkdir(
              parents=True,
              exist_ok=True
          )

          output_path.write_text(
              json.dumps(
                  output,
                  indent=2,
                  ensure_ascii=False
              ) + "\n",
              encoding="utf-8"
          )

          print(
              "========================================"
          )

          print(
              "LOCAL EVIDENCE SNAPSHOT"
          )

          print(
              "========================================"
          )

          for coin, item in output["coins"].items():

              print(
                  f"{coin}: "
                  f"event={item['last_event']} | "
                  f"lifecycle={item['lifecycle_state']} | "
                  f"pressure={item['orderbook_pressure']} | "
                  f"decision=DEFERRED"
              )

          print()
          print(
              "Final decision authority remains "
              "outside GitHub."
          )

      - name: Commit local evidence
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state/decision.json

          if git diff --cached --quiet; then
            echo "No local evidence changes."
            exit 0
          fi

          git commit -m "Update local evidence snapshot"
          git push origin HEAD:main
