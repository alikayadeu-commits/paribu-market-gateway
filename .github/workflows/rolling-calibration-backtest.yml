name: Rolling Calibration Backtest

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rolling-calibration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run rolling calibration backtest
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json
          import glob
          import math
          from pathlib import Path
          from datetime import datetime, timezone, timedelta

          COINS = {
              "VIRTUAL": "virtual_tl",
              "FET": "fet_tl",
              "KITE": "kite_tl",
          }

          HORIZONS = {
              "15m": timedelta(minutes=15),
              "1h": timedelta(hours=1),
              "4h": timedelta(hours=4),
              "24h": timedelta(hours=24),
          }

          BASELINE_WINDOW = timedelta(days=7)
          MINIMUM_HISTORY = timedelta(days=14)

          REGIME_WINDOW = timedelta(hours=72)
          SHORT_WINDOW = timedelta(hours=24)

          FOCUS_START = datetime(
              2026, 8, 19, 0, 0, tzinfo=timezone.utc
          )

          FOCUS_END = datetime(
              2026, 8, 22, 0, 0, tzinfo=timezone.utc
          )

          OUTPUT = Path(
              "state/rolling_calibration_backtest.json"
          )

          MIN_BASELINE_OBSERVATIONS = 20


          def parse_time(value):
              if not value:
                  return None

              try:
                  dt = datetime.fromisoformat(
                      value.replace("Z", "+00:00")
                  )

                  if dt.tzinfo is None:
                      dt = dt.replace(
                          tzinfo=timezone.utc
                      )

                  return dt.astimezone(timezone.utc)

              except (TypeError, ValueError):
                  return None


          def number(value):
              try:
                  return float(value)
              except (TypeError, ValueError):
                  return None


          def percentile(values, p):
              if not values:
                  return None

              values = sorted(values)

              if len(values) == 1:
                  return values[0]

              position = (
                  (len(values) - 1) * p
              )

              lower = math.floor(position)
              upper = math.ceil(position)

              if lower == upper:
                  return values[lower]

              fraction = position - lower

              return (
                  values[lower]
                  + (
                      values[upper]
                      - values[lower]
                  ) * fraction
              )


          def load_history():
              snapshots = []

              for path in sorted(
                  glob.glob("history/*.jsonl")
              ):

                  try:
                      raw = Path(
                          path
                      ).read_text(
                          encoding="utf-8"
                      )
                  except OSError:
                      continue

                  for line in raw.splitlines():

                      line = line.strip()

                      if not line:
                          continue

                      try:
                          item = json.loads(line)
                      except json.JSONDecodeError:
                          continue

                      timestamp = parse_time(
                          item.get("fetched_at")
                      )

                      if timestamp is None:
                          continue

                      markets = item.get(
                          "markets",
                          {}
                      )

                      prices = {}

                      for coin, market in COINS.items():

                          market_data = markets.get(
                              market,
                              {}
                          )

                          price = number(
                              market_data.get("last")
                          )

                          if (
                              price is None
                              and isinstance(
                                  market_data.get("ticker"),
                                  list
                              )
                          ):
                              try:
                                  price = number(
                                      market_data[
                                          "ticker"
                                      ][0]["last"]
                                  )
                              except (
                                  KeyError,
                                  TypeError,
                                  IndexError
                              ):
                                  price = None

                          if (
                              price is not None
                              and price > 0
                          ):
                              prices[coin] = price

                      if prices:
                          snapshots.append({
                              "timestamp": timestamp,
                              "prices": prices
                          })

              snapshots.sort(
                  key=lambda x: x["timestamp"]
              )

              deduped = []

              for item in snapshots:

                  if (
                      deduped
                      and item["timestamp"]
                      == deduped[-1]["timestamp"]
                  ):
                      deduped[-1] = item
                  else:
                      deduped.append(item)

              return deduped


          def find_reference(
              snapshots,
              index,
              target_time,
              tolerance
          ):
              best = None
              best_gap = None

              for j in range(
                  index - 1,
                  -1,
                  -1
              ):

                  timestamp = snapshots[j][
                      "timestamp"
                  ]

                  if timestamp > target_time:
                      continue

                  gap = (
                      target_time - timestamp
                  ).total_seconds()

                  if gap > tolerance.total_seconds():
                      break

                  if (
                      best_gap is None
                      or gap < best_gap
                  ):
                      best = snapshots[j]
                      best_gap = gap

              return best


          def horizon_return(
              snapshots,
              index,
              coin,
              horizon
          ):
              current = snapshots[index]

              current_price = current[
                  "prices"
              ].get(coin)

              if current_price is None:
                  return None

              target_time = (
                  current["timestamp"]
                  - horizon
              )

              reference = find_reference(
                  snapshots,
                  index,
                  target_time,
                  timedelta(minutes=20)
              )

              if reference is None:
                  return None

              previous_price = reference[
                  "prices"
              ].get(coin)

              if (
                  previous_price is None
                  or previous_price <= 0
              ):
                  return None

              return (
                  (
                      current_price
                      - previous_price
                  )
                  / previous_price
                  * 100.0
              )


          def historical_horizon_returns(
              snapshots,
              index,
              coin,
              horizon,
              baseline_window
          ):
              current_time = snapshots[index][
                  "timestamp"
              ]

              window_start = (
                  current_time
                  - baseline_window
              )

              values = []

              for j in range(
                  index - 1,
                  -1,
                  -1
              ):

                  historical_time = snapshots[j][
                      "timestamp"
                  ]

                  if historical_time < window_start:
                      break

                  value = horizon_return(
                      snapshots,
                      j,
                      coin,
                      horizon
                  )

                  if value is not None:
                      values.append(value)

              return values


          def average_absolute(values):
              if not values:
                  return None

              return (
                  sum(
                      abs(value)
                      for value in values
                  )
                  / len(values)
              )


          def classify(
              current_move,
              baseline_moves
          ):
              if (
                  current_move is None
                  or not baseline_moves
              ):
                  return "INSUFFICIENT_DATA"

              magnitudes = [
                  abs(value)
                  for value in baseline_moves
                  if value is not None
              ]

              if not magnitudes:
                  return "INSUFFICIENT_DATA"

              p50 = percentile(
                  magnitudes,
                  0.50
              )

              p75 = percentile(
                  magnitudes,
                  0.75
              )

              p90 = percentile(
                  magnitudes,
                  0.90
              )

              p95 = percentile(
                  magnitudes,
                  0.95
              )

              magnitude = abs(
                  current_move
              )

              if magnitude <= p50:
                  return "NORMAL"

              if magnitude <= p75:
                  return "ELEVATED"

              if magnitude <= p90:
                  return "SIGNIFICANT"

              if magnitude <= p95:
                  return "STRONG"

              return "EXTREME"


          def regime_label(
              recent_vol,
              baseline_vol
          ):
              if (
                  recent_vol is None
                  or baseline_vol is None
                  or baseline_vol <= 0
              ):
                  return "UNKNOWN"

              ratio = (
                  recent_vol
                  / baseline_vol
              )

              if ratio < 0.75:
                  return "QUIET"

              if ratio < 1.25:
                  return "NORMAL"

              if ratio < 1.75:
                  return "ELEVATED"

              return "HIGH"


          snapshots = load_history()

          print("========================================")
          print("ROLLING CALIBRATION BACKTEST")
          print("========================================")

          print(
              f"Historical snapshots: "
              f"{len(snapshots)}"
          )

          if not snapshots:
              raise SystemExit(
                  "No historical data found."
              )

          history_start = snapshots[0][
              "timestamp"
          ]

          history_end = snapshots[-1][
              "timestamp"
          ]

          history_duration = (
              history_end
              - history_start
          )

          print(
              "History:",
              history_start.isoformat(),
              "->",
              history_end.isoformat()
          )

          print(
              "History duration:",
              str(history_duration)
          )

          print()
          print("Baseline window: 7 days")
          print("Minimum history required: 14 days")
          print("Regime window: 72 hours")
          print("Short-term window: 24 hours")

          activation = {
              "active": (
                  history_duration
                  >= MINIMUM_HISTORY
              ),
              "minimum_history_days": 14,
              "available_history_days": (
                  history_duration.total_seconds()
                  / 86400.0
              ),
              "reason": None
          }

          if not activation["active"]:
              activation["reason"] = (
                  "Rolling calibration inactive: "
                  "minimum 14-day history requirement "
                  "has not been reached."
              )

          print()
          print("========================================")
          print("CALIBRATION ACTIVATION")
          print("========================================")

          print(
              "Status:",
              "ACTIVE"
              if activation["active"]
              else "INACTIVE"
          )

          print(
              "Available history:",
              f"{activation['available_history_days']:.2f} days"
          )

          print(
              "Required history:",
              "14.00 days"
          )

          if activation["reason"]:
              print(
                  "Reason:",
                  activation["reason"]
              )

          report = {
              "schema_version": 3,
              "timezone": "UTC",
              "activation": activation,
              "baseline_window": "7d",
              "minimum_history": "14d",
              "regime_window": "72h",
              "short_window": "24h",
              "baseline_method": (
                  "same_horizon_historical_returns"
              ),
              "focus_period": {
                  "start": (
                      FOCUS_START
                      .isoformat()
                      .replace(
                          "+00:00",
                          "Z"
                      )
                  ),
                  "end": (
                      FOCUS_END
                      .isoformat()
                      .replace(
                          "+00:00",
                          "Z"
                      )
                  )
              },
              "coins": {}
          }

          print()
          print("========================================")
          print("FOCUS PERIOD: 19-21 AUGUST UTC")
          print("========================================")

          if not activation["active"]:

              print()
              print(
                  "Rolling calibration is INACTIVE."
              )

              print(
                  "No rolling classifications "
                  "will be produced."
              )

              for coin in COINS:

                  report["coins"][coin] = {
                      "status": "INACTIVE",
                      "observations": 0,
                      "results": []
                  }

          else:

              for coin in COINS:

                  results = []

                  for i, snapshot in enumerate(
                      snapshots
                  ):

                      timestamp = snapshot[
                          "timestamp"
                      ]

                      if not (
                          FOCUS_START
                          <= timestamp
                          < FOCUS_END
                      ):
                          continue

                      if (
                          timestamp
                          - history_start
                          < MINIMUM_HISTORY
                      ):
                          continue

                      current = {}
                      baseline = {}
                      classifications = {}

                      enough_data = True

                      for (
                          name,
                          horizon
                      ) in HORIZONS.items():

                          current_move = (
                              horizon_return(
                                  snapshots,
                                  i,
                                  coin,
                                  horizon
                              )
                          )

                          historical_moves = (
                              historical_horizon_returns(
                                  snapshots,
                                  i,
                                  coin,
                                  horizon,
                                  BASELINE_WINDOW
                              )
                          )

                          current[name] = (
                              current_move
                          )

                          baseline[name] = (
                              historical_moves
                          )

                          classifications[name] = (
                              classify(
                                  current_move,
                                  historical_moves
                              )
                          )

                          if (
                              current_move is None
                              or len(
                                  historical_moves
                              )
                              < MIN_BASELINE_OBSERVATIONS
                          ):
                              enough_data = False

                      if not enough_data:
                          continue

                      recent_72h = []
                      recent_24h = []

                      for j in range(
                          i - 1,
                          -1,
                          -1
                      ):

                          historical_time = (
                              snapshots[j][
                                  "timestamp"
                              ]
                          )

                          age = (
                              timestamp
                              - historical_time
                          )

                          if age > REGIME_WINDOW:
                              break

                          value = horizon_return(
                              snapshots,
                              j,
                              coin,
                              HORIZONS["15m"]
                          )

                          if value is not None:
                              recent_72h.append(
                                  abs(value)
                              )

                      for j in range(
                          i - 1,
                          -1,
                          -1
                      ):

                          historical_time = (
                              snapshots[j][
                                  "timestamp"
                              ]
                          )

                          age = (
                              timestamp
                              - historical_time
                          )

                          if age > SHORT_WINDOW:
                              break

                          value = horizon_return(
                              snapshots,
                              j,
                              coin,
                              HORIZONS["15m"]
                          )

                          if value is not None:
                              recent_24h.append(
                                  abs(value)
                              )

                      baseline_7d = (
                          average_absolute(
                              baseline["15m"]
                          )
                      )

                      recent_72h_average = (
                          average_absolute(
                              recent_72h
                          )
                      )

                      recent_24h_average = (
                          average_absolute(
                              recent_24h
                          )
                      )

                      regime = regime_label(
                          recent_72h_average,
                          baseline_7d
                      )

                      results.append({
                          "timestamp": (
                              timestamp
                              .isoformat()
                              .replace(
                                  "+00:00",
                                  "Z"
                              )
                          ),
                          "regime": regime,
                          "current": current,
                          "rolling": classifications,
                          "recent_regime": {
                              "72h_average_abs_15m_move": (
                                  recent_72h_average
                              ),
                              "24h_average_abs_15m_move": (
                                  recent_24h_average
                              ),
                              "7d_average_abs_15m_move": (
                                  baseline_7d
                              )
                          }
                      })

                  report["coins"][coin] = {
                      "status": "ACTIVE",
                      "observations": len(
                          results
                      ),
                      "results": results
                  }

                  print()
                  print(coin)

                  if not results:
                      print(
                          "  No valid observations."
                      )
                      continue

                  for horizon in (
                      "15m",
                      "1h",
                      "4h",
                      "24h"
                  ):

                      counts = {
                          "NORMAL": 0,
                          "ELEVATED": 0,
                          "SIGNIFICANT": 0,
                          "STRONG": 0,
                          "EXTREME": 0,
                          "INSUFFICIENT_DATA": 0
                      }

                      for item in results:

                          label = item[
                              "rolling"
                          ][horizon]

                          counts[label] = (
                              counts.get(
                                  label,
                                  0
                              ) + 1
                          )

                      print(
                          f"  {horizon}: "
                          f"N={counts['NORMAL']} "
                          f"E={counts['ELEVATED']} "
                          f"S={counts['SIGNIFICANT']} "
                          f"ST={counts['STRONG']} "
                          f"X={counts['EXTREME']}"
                      )

                  regimes = {}

                  for item in results:

                      regime = item[
                          "regime"
                      ]

                      regimes[regime] = (
                          regimes.get(
                              regime,
                              0
                          ) + 1
                      )

                  print(
                      "  Regime:",
                      " ".join(
                          f"{key}={value}"
                          for key, value
                          in sorted(
                              regimes.items()
                          )
                      )
                  )

                  latest = results[-1]

                  print(
                      "  Latest:"
                  )

                  print(
                      f"    {latest['timestamp']} "
                      f"| regime={latest['regime']} "
                      f"| 15m={latest['rolling']['15m']} "
                      f"| 1h={latest['rolling']['1h']} "
                      f"| 4h={latest['rolling']['4h']} "
                      f"| 24h={latest['rolling']['24h']}"
                  )

                  print(
                      "  Latest current moves:"
                  )

                  for horizon in (
                      "15m",
                      "1h",
                      "4h",
                      "24h"
                  ):

                      value = latest[
                          "current"
                      ][horizon]

                      if value is None:
                          print(
                              f"    {horizon}: unavailable"
                          )
                      else:
                          print(
                              f"    {horizon}: "
                              f"{value:+.4f}%"
                          )

          OUTPUT.parent.mkdir(
              parents=True,
              exist_ok=True
          )

          OUTPUT.write_text(
              json.dumps(
                  report,
                  indent=2,
                  ensure_ascii=False
              ) + "\n",
              encoding="utf-8"
          )

          print()
          print("========================================")
          print(
              "Rolling calibration backtest written to"
          )
          print(
              "state/rolling_calibration_backtest.json"
          )
          print("========================================")
          PY

      - name: Validate report
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json

          path = (
              "state/rolling_calibration_backtest.json"
          )

          with open(
              path,
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          assert data["schema_version"] == 3
          assert data["timezone"] == "UTC"
          assert data["baseline_window"] == "7d"
          assert data["minimum_history"] == "14d"
          assert data["regime_window"] == "72h"
          assert data["short_window"] == "24h"

          assert "activation" in data

          for coin in (
              "VIRTUAL",
              "FET",
              "KITE"
          ):
              assert coin in data["coins"]

          if not data["activation"]["active"]:

              for coin in (
                  "VIRTUAL",
                  "FET",
                  "KITE"
              ):
                  assert (
                      data["coins"][coin]["status"]
                      == "INACTIVE"
                  )

          print(
              "Rolling calibration activation validation: OK"
          )
          PY
