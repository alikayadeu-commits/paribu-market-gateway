name: Event Lifecycle Backtest

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lifecycle-backtest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run lifecycle backtest
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json
          import glob
          from datetime import datetime, timezone

          COINS = {
              "VIRTUAL": "virtual_tl",
              "FET": "fet_tl",
              "KITE": "kite_tl",
          }

          HORIZONS = {
              "15m": 15 * 60,
              "1h": 60 * 60,
              "4h": 4 * 60 * 60,
          }

          MAX_GAPS = {
              "15m": 12 * 60,
              "1h": 20 * 60,
              "4h": 30 * 60,
          }

          EPISODE_GAP_SECONDS = 60 * 60

          def parse_time(value):
              if not value:
                  return None

              value = value.strip()

              if value.endswith("Z"):
                  value = value[:-1] + "+00:00"

              dt = datetime.fromisoformat(value)

              if dt.tzinfo is None:
                  dt = dt.replace(tzinfo=timezone.utc)

              return dt.astimezone(timezone.utc)

          def load_history():
              snapshots = []

              for path in sorted(glob.glob("history/*.jsonl")):
                  try:
                      with open(path, "r", encoding="utf-8") as f:
                          raw = f.read()

                      try:
                          wrapper = json.loads(raw)

                          if (
                              isinstance(wrapper, dict)
                              and isinstance(wrapper.get("content"), str)
                          ):
                              lines = wrapper["content"].splitlines()
                          else:
                              lines = raw.splitlines()

                      except json.JSONDecodeError:
                          lines = raw.splitlines()

                      for line in lines:
                          line = line.strip()

                          if not line:
                              continue

                          try:
                              item = json.loads(line)
                          except json.JSONDecodeError:
                              continue

                          timestamp = parse_time(item.get("fetched_at"))

                          if timestamp is None:
                              continue

                          markets = item.get("markets", {})
                          prices = {}

                          for coin, market_key in COINS.items():
                              market = markets.get(market_key, {})

                              try:
                                  price = float(market.get("last"))
                              except (TypeError, ValueError):
                                  price = None

                              if price is not None and price > 0:
                                  prices[coin] = price

                          if prices:
                              snapshots.append({
                                  "timestamp": timestamp,
                                  "prices": prices,
                              })

                  except OSError:
                      continue

              snapshots.sort(key=lambda x: x["timestamp"])

              deduped = []

              for snapshot in snapshots:
                  if (
                      deduped
                      and snapshot["timestamp"]
                      == deduped[-1]["timestamp"]
                  ):
                      deduped[-1] = snapshot
                  else:
                      deduped.append(snapshot)

              return deduped

          def find_previous(
              snapshots,
              index,
              seconds,
              max_gap
          ):
              current = snapshots[index]["timestamp"].timestamp()
              target = current - seconds

              for j in range(index - 1, -1, -1):
                  previous = snapshots[j]["timestamp"].timestamp()

                  if previous <= target:
                      gap = target - previous

                      if gap <= max_gap:
                          return snapshots[j]

                      return None

              return None

          def get_return(
              snapshots,
              index,
              coin,
              horizon,
          ):
              previous = find_previous(
                  snapshots,
                  index,
                  HORIZONS[horizon],
                  MAX_GAPS[horizon],
              )

              if previous is None:
                  return None

              current_price = snapshots[index]["prices"].get(coin)
              previous_price = previous["prices"].get(coin)

              if (
                  current_price is None
                  or previous_price is None
                  or previous_price <= 0
              ):
                  return None

              return (
                  (current_price - previous_price)
                  / previous_price
                  * 100.0
              )

          def direction(value):
              if value is None:
                  return "UNKNOWN"

              if value > 0:
                  return "UP"

              if value < 0:
                  return "DOWN"

              return "FLAT"

          def classify(
              value,
              thresholds
          ):
              if value is None:
                  return "NONE"

              absolute = abs(value)

              p90 = thresholds.get("p90")
              p95 = thresholds.get("p95")
              p97 = thresholds.get("p97_5")
              p99 = thresholds.get("p99")

              if p99 is not None and absolute >= p99:
                  return "EXTREME"

              if p97 is not None and absolute >= p97:
                  return "STRONG"

              if p95 is not None and absolute >= p95:
                  return "SIGNIFICANT"

              if p90 is not None and absolute >= p90:
                  return "ELEVATED"

              return "NORMAL"

          def strength_score(classifications):
              score = {
                  "NONE": 0,
                  "NORMAL": 0,
                  "ELEVATED": 1,
                  "SIGNIFICANT": 2,
                  "STRONG": 3,
                  "EXTREME": 4,
              }

              values = [
                  score.get(value, 0)
                  for value in classifications
              ]

              return max(values) if values else 0

          def lifecycle_state(
              current,
              previous,
              current_score,
              previous_score,
          ):
              if current is None:
                  return "NO_EVENT"

              if previous is None:
                  return "NEW_EVENT"

              current_direction = direction(current)
              previous_direction = direction(previous)

              if (
                  current_direction != "UNKNOWN"
                  and previous_direction != "UNKNOWN"
                  and current_direction != previous_direction
                  and current_direction != "FLAT"
                  and previous_direction != "FLAT"
              ):
                  return "REVERSAL"

              if current_score > previous_score:
                  return "ACCELERATION"

              if current_score < previous_score:
                  return "DECELERATION"

              return "CONTINUATION"

          print("========================================")
          print("EVENT LIFECYCLE BACKTEST")
          print("========================================")

          with open(
              "state/calibration.json",
              "r",
              encoding="utf-8"
          ) as f:
              calibration = json.load(f)

          snapshots = load_history()

          print(
              f"Historical snapshots: {len(snapshots)}"
          )

          if len(snapshots) < 20:
              raise SystemExit(
                  "Not enough historical snapshots."
              )

          print(
              "History:",
              snapshots[0]["timestamp"].isoformat(),
              "->",
              snapshots[-1]["timestamp"].isoformat()
          )

          print()

          all_results = {}

          for coin in COINS:
              records = []

              previous_record = None

              for i, snapshot in enumerate(snapshots):
                  returns = {}
                  classifications = {}

                  for horizon in HORIZONS:
                      value = get_return(
                          snapshots,
                          i,
                          coin,
                          horizon
                      )

                      returns[horizon] = value

                      thresholds = (
                          calibration
                          .get("coins", {})
                          .get(coin, {})
                          .get("horizons", {})
                          .get(horizon, {})
                          .get("absolute_return_pct", {})
                      )

                      classifications[horizon] = classify(
                          value,
                          thresholds
                      )

                  score = strength_score(
                      classifications.values()
                  )

                  significant = any(
                      value in {
                          "SIGNIFICANT",
                          "STRONG",
                          "EXTREME"
                      }
                      for value in classifications.values()
                  )

                  if not significant:
                      previous_record = None
                      continue

                  primary_horizon = None

                  for horizon in ("15m", "1h", "4h"):
                      if classifications[horizon] in {
                          "SIGNIFICANT",
                          "STRONG",
                          "EXTREME"
                      }:
                          primary_horizon = horizon
                          break

                  primary_return = (
                      returns[primary_horizon]
                      if primary_horizon
                      else None
                  )

                  previous_return = (
                      previous_record["primary_return"]
                      if previous_record is not None
                      else None
                  )

                  previous_score = (
                      previous_record["score"]
                      if previous_record is not None
                      else 0
                  )

                  state = lifecycle_state(
                      primary_return,
                      previous_return,
                      score,
                      previous_score,
                  )

                  record = {
                      "timestamp": (
                          snapshot["timestamp"]
                          .isoformat()
                          .replace("+00:00", "Z")
                      ),
                      "state": state,
                      "primary_horizon": primary_horizon,
                      "primary_return": (
                          round(primary_return, 4)
                          if primary_return is not None
                          else None
                      ),
                      "score": score,
                      "classifications": classifications,
                      "returns": {
                          horizon: (
                              round(value, 4)
                              if value is not None
                              else None
                          )
                          for horizon, value
                          in returns.items()
                      },
                  }

                  records.append(record)
                  previous_record = record

              # ------------------------------------------------------
              # Convert records into lifecycle episodes.
              # ------------------------------------------------------

              episodes = []

              for record in records:
                  timestamp = parse_time(record["timestamp"])

                  if not episodes:
                      episodes.append({
                          "start": timestamp,
                          "end": timestamp,
                          "direction": direction(
                              record["primary_return"]
                          ),
                          "states": [record["state"]],
                          "records": [record],
                      })
                      continue

                  current_episode = episodes[-1]

                  gap = (
                      timestamp
                      - current_episode["end"]
                  ).total_seconds()

                  current_direction = direction(
                      record["primary_return"]
                  )

                  same_direction = (
                      current_direction
                      == current_episode["direction"]
                  )

                  if (
                      gap <= EPISODE_GAP_SECONDS
                      and same_direction
                  ):
                      current_episode["end"] = timestamp
                      current_episode["states"].append(
                          record["state"]
                      )
                      current_episode["records"].append(
                          record
                      )
                  else:
                      episodes.append({
                          "start": timestamp,
                          "end": timestamp,
                          "direction": current_direction,
                          "states": [record["state"]],
                          "records": [record],
                      })

              episode_output = []

              for episode in episodes:
                  states = episode["states"]

                  episode_output.append({
                      "start": (
                          episode["start"]
                          .isoformat()
                          .replace("+00:00", "Z")
                      ),
                      "end": (
                          episode["end"]
                          .isoformat()
                          .replace("+00:00", "Z")
                      ),
                      "direction": episode["direction"],
                      "records": len(
                          episode["records"]
                      ),
                      "new_event": states.count(
                          "NEW_EVENT"
                      ),
                      "continuation": states.count(
                          "CONTINUATION"
                      ),
                      "acceleration": states.count(
                          "ACCELERATION"
                      ),
                      "deceleration": states.count(
                          "DECELERATION"
                      ),
                      "reversal": states.count(
                          "REVERSAL"
                      ),
                  })

              all_results[coin] = {
                  "lifecycle_records": len(records),
                  "episodes": len(episode_output),
                  "state_counts": {
                      state: sum(
                          1
                          for record in records
                          if record["state"] == state
                      )
                      for state in (
                          "NEW_EVENT",
                          "CONTINUATION",
                          "ACCELERATION",
                          "DECELERATION",
                          "REVERSAL",
                      )
                  },
                  "episodes_detail": episode_output,
              }

          # ------------------------------------------------------------
          # Focus period.
          # ------------------------------------------------------------

          focus_start = datetime(
              2026,
              8,
              19,
              0,
              0,
              tzinfo=timezone.utc
          )

          focus_end = datetime(
              2026,
              8,
              22,
              0,
              0,
              tzinfo=timezone.utc
          )

          print("========================================")
          print("FOCUS PERIOD: 19-21 AUGUST UTC")
          print("========================================")

          focus_results = {}

          for coin, data in all_results.items():
              focus_episodes = []

              for episode in data["episodes_detail"]:
                  start = parse_time(
                      episode["start"]
                  )
                  end = parse_time(
                      episode["end"]
                  )

                  if (
                      end >= focus_start
                      and start < focus_end
                  ):
                      focus_episodes.append(
                          episode
                      )

              focus_results[coin] = {
                  "episodes": len(
                      focus_episodes
                  ),
                  "episodes_detail": focus_episodes,
              }

              print()
              print(coin)

              print(
                  "  Episodes:",
                  len(focus_episodes)
              )

              for episode in focus_episodes:
                  print(
                      "  ",
                      episode["start"],
                      "->",
                      episode["end"],
                      "|",
                      episode["direction"],
                      "|",
                      f"records={episode['records']}",
                      f"new={episode['new_event']}",
                      f"accel={episode['acceleration']}",
                      f"decel={episode['deceleration']}",
                      f"reversal={episode['reversal']}",
                  )

          report = {
              "schema_version": 1,
              "generated_at": (
                  datetime.now(timezone.utc)
                  .isoformat()
                  .replace("+00:00", "Z")
              ),
              "timezone": "UTC",
              "method": {
                  "episode_gap_seconds":
                      EPISODE_GAP_SECONDS,
                  "description": (
                      "Groups significant historical movements "
                      "into lifecycle episodes and classifies "
                      "new events, continuation, acceleration, "
                      "deceleration and reversal."
                  ),
                  "no_trade_decision": True,
              },
              "history": {
                  "snapshots": len(snapshots),
                  "start": (
                      snapshots[0]["timestamp"]
                      .isoformat()
                      .replace("+00:00", "Z")
                  ),
                  "end": (
                      snapshots[-1]["timestamp"]
                      .isoformat()
                      .replace("+00:00", "Z")
                  ),
              },
              "all_history": all_results,
              "focus_19_21_august": focus_results,
          }

          with open(
              "state/event_lifecycle_backtest.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  report,
                  f,
                  indent=2,
                  ensure_ascii=False
              )
              f.write("\n")

          print()
          print(
              "Lifecycle backtest report written to "
              "state/event_lifecycle_backtest.json"
          )
          PY

      - name: Validate lifecycle report
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json

          with open(
              "state/event_lifecycle_backtest.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          assert data["schema_version"] == 1
          assert data["timezone"] == "UTC"

          for coin in (
              "VIRTUAL",
              "FET",
              "KITE"
          ):
              assert coin in data["all_history"]
              assert coin in data["focus_19_21_august"]

          print(
              "Event lifecycle backtest validation: OK"
          )
          PY
